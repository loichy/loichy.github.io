name: Sync Slides from Private Repo

on:
  schedule:
    - cron: '0 */6 * * *'  # Toutes les 6 heures au lieu de chaque heure
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  sync_slides:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Website Repo
        uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SLIDES_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone Private Slides Repo
        run: |
          git clone --depth 1 git@github.com:loichy/EconomieNature_Slides.git slides-temp

      - name: Copy Slides to Public Repo
        run: |
          cp slides-temp/Theme1_Slides.html slides/ 
          cp slides-temp/Theme2_Slides.html slides/
          cp slides-temp/xaringan-themer.css slides/
          cp -r slides-temp/css slides/ 2>/dev/null || true
          cp -r slides-temp/img slides/ 2>/dev/null || true
          cp -r slides-temp/libs slides/ 2>/dev/null || true
          rm -rf slides-temp
          
      - name: Check for changes
        id: check_changes
        run: |
          git add slides/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "🔄 Sync slides from private repo [$(date +'%Y-%m-%d %H:%M')]"
          git push origin main
          
          
      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Slides synchronized successfully"
          else
            echo "ℹ️ No changes detected"
          fi
