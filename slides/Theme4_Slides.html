## Définition (I)

.White.bg-Gold[Les transitions écologiques]

&gt; Les transitions écologiques sont des **transformations**, impliquant une phase de transition et l'état « après » celle-ci.
Les transformations écologiques en question sont permises par:
1. Les politiques d’atténuation du changement climatique et d’adaptation aux conséquences de celui-ci 
2. Les politiques de réduction des pressions sur la biodiversité, de diminution des pollutions (eau, air, sol)
3. Les politiques de ralentissement de (ou l’alternative à) l’épuisement des ressources

--

]
.pull-right-wide[
Le .White.bg-Gold[processus de changement] **d'un état ou d'une condition à un autre** sur une période donnée. La transition peut se produire au niveau des individus, des entreprises, des villes, des régions et des nations, et peut être basée sur un changement .White.bg-Gold[incrémental ou transformateur.]
]

Une définition **large** :
* Un terme débattu 
  * .White.bg-Gold[La bifurcation] est moins utilisée, et encore moins pour .White.bg-Gold[la décroissance]
  * [J-B Fressoz, ''Sans transition'':](https://www.youtube.com/watch?v=p5VEy2IjDMs) une histoire de la transition énergétique, où nous n'observons pas de transitions/substitutions dans les sources d'énergie au fil du temps

## L'exemple de la transition énergétique

**La transition énergétique** avec une .White.bg-Gold[taxe carbone]

1. Taxe **augmente le prix des combustibles fossiles** proportionnellement au carbone qu’ils émettent 
2. Incitation à modifier l’allocation des ressources en fonction des nouveaux prix relatifs
  * Atteindre **l’optimum social**: l’état idéal de l’allocation des ressources qui maximise le bien-être de tous. 
  
--

* **Différents formes de politiques économiques** en matière de carbone existent: 
  * Taxe indirecte sur les produits énergétiques, système de plafonnement et d’échange associé à des permis d’émission, ou prix interne dans la prise de décision en matière d’investissement
  * Nous allons ici **étudier le choix entre ces politiques** permettant d'éliminer les combustibles fossiles du bouquet énergétique 
  
  
???

L’augmentation du coût des combustibles fossiles stimulerait également l’investissement dans des activités moins intensives en carbone et modifierait donc la structure du stock de capital, en remplaçant le capital à forte intensité de carbone par du capital à moindre intensité de carbone. 

D’un point de vue purement technique, cela signifie investir dans plusieurs technologies et actions, telles que l’augmentation des sources d’énergie renouvelables dans la production d’électricité, la rénovation des bâtiments résidentiels publics et commerciaux, le développement des systèmes de transport public ou l’accélération de l’électrification de la flotte de véhicules. 

Ce processus de décarbonation est généralement appelé transition énergétique, car il implique un changement dans la consommation d’énergie, par des mesures d’efficacité énergétique, c’est-à-dire par une moindre consommation d’énergie à usages donnés

## Définition (II)

**Les politiques économiques**
&gt; Les actions mises en oeuvre par le régulateur pour atteindre des objectifs

* Le régulateur inclue ici **l'état central**, **les collectivités territoriales**, la **banque centrale**
* Les objectifs des transitions écologiques nécessitent d'**élargir la focale au-delà de l'analyse des instruments de politique environnementale** et d'.White.bg-Gold[inclure l'ensemble des politiques économiques]

---
## Les instruments conventionnels de la politique environnementale

* Les **instruments réglementaires** ("*command-and-control*" en anglais)
  * Normes et standards
  * Interdictions
  * Responsabilité élargie du producteur

* Les **instruments en prix** 
  * **Taxes sur les émissions** ou **subventions sur les pratiques vertueuses**
  * Les **permis d'émission échangeables**

---
## Etendre la politique environnementale à l'ensemble des politiques économiques

Les **objectifs sont larges** et les conséquences de telles politiques environnementales sont **systémiques**: il est nécessaire d'.White.bg-Gold[adopter une vision englobant l'ensemble de la politique économique].

Aux instruments précédents, on y ajoute alors
* La **politique monétaire**
* Les **instruments de financement** publics
* La **définition des droits de propriété**

## Marché et planification : dépasser le clivage

.pull-left[
**Les tenants du marché**
* Prix comme signal d'allocation optimale des ressources
* Pigou (1920), Coase (1960), Hayek (1945)
* Instruments: taxes, permis échangeables

**Les tenants de la planification**
* L'État oriente les grandes variables macro vers des objectifs collectifs de LT
* Keynes (1936), Mazzucato (2013), Chancel &amp; Saez
* Instruments: investissement public, crédit dirigé
]

.pull-right[
.White.bg-Gold[Pourquoi dépasser ce clivage pour les transitions écologiques ?]

Les transitions sont **systémiques** : elles impliquent simultanément
* Des **défaillances de marché** (externalités, biens publics, myopie des agents)
* Des **défaillances de l'État** (capture réglementaire, contraintes budgétaires)

`\(\Rightarrow\)` Ni le marché seul, ni la planification seule ne suffisent
]

## Deux questions structurantes de ce chapitre

1. Quel **niveau de discipline** imposer au marché ? *(question d'efficacité économique)*
2. Quelle **implication de l'État** dans le financement de la transition ? *(question politique, sociale et démocratique)*

&gt; Le capitalisme contemporain peut-il intégrer les limites planétaires — par la technologie, sans croissance, ou faut-il dépasser ses institutions fondamentales ?

???
s’agit-il d’une équation insoluble pour un mode de production fondé sur l’accumulation et l’extension indéfinie de la sphère marchande


Les réponses de politique économique typiques:
- la création d’incitations fiscales et réglementaires susceptibles de réorienter les flux de capitaux et l’innovation technique vers les secteurs « verts »
- reconsidérer l’intervention de l’État en matière de choix techno-scientifiques et d’emploi à travers des instruments de planification et d’orientation du crédit
- un mix marché et planification

## 2. Les politiques économiques de transition par le marché

---

## De la réglementation aux instruments de marché : une histoire récente

**Après la Seconde Guerre mondiale**, l'expansion économique dégrade fortement les conditions environnementales

* **Deux moteurs du changement** vont progressivement transformer cette approche :
  1. Des **événements ponctuels de pollution** destructeurs et qui choquent l'opinion publique
  2. La montée d'un **mouvement environnementaliste** qui impose la question écologique dans le débat politique

* La politique environnementale est **jusqu'alors réglementaire** :
  * Normes d'émissions, interdictions, standards technologiques imposés par l'État
  * Logique : *command-and-control* — l'État prescrit ce qui est permis et ce qui est interdit

* **Décembre 1952** : un épisode de pollution atmosphérique exceptionnelle paralyse Londres
  * Mélange de brouillard, de suie et de dioxyde de soufre issu du chauffage au charbon
  * **Entre 4 000 et 12 000 morts** en quelques jours

  * Premières restrictions sur la combustion du charbon en zone urbaine
  * Un instrument **réglementaire** : interdictions et normes géographiques

* Le Grand Smog reste l'un des événements environnementaux les plus meurtriers de l'histoire occidentale
* Il illustre comment un choc médiatique peut déclencher une réponse réglementaire rapide

## Le Clean Water Act (1972)

* **Contexte** : les eaux de surface américaines fortement dégradées par l'industrialisation d'après-guerre
* Le *Clean Water Act* de **1972** :
  * **Objectif affiché** : des rejets de polluants dans les eaux navigables
  * Financement fédéral massif pour la construction de stations d'épuration
  * .White.bg-Gold[Un instrument réglementaire] avec des standards d'émissions stricts pour les sources ponctuelles
* .White.bg-Gold[Une politique peu efficace d'un point de vue économique]:
  * L'objectif d'élimination totale de la pollution est économiquement inefficace
  * Il ne tient pas compte du coût marginal d'abattement ni de l'équilibre avec les dommages

* **Influence des économistes croissante à partir des années 1980 et 1990**

---
## Le marché de permis SO2 aux États-Unis (1990)

* **Problème** : les émissions de dioxyde de soufre (SO2) des centrales à charbon causent des pluies acides
  * Dommages aux forêts, aux lacs et à la santé humaine, parfois à des centaines de kilomètres de la source
  * Prise de conscience progressive dans les années 70-80 en Europe et aux États-Unis

* **L'amendement de 1990 du *Clean Air Act* **, signé par **George H.W. Bush** :
  * Crée le **premier grand marché de permis d'émissions** au monde
  * Les centrales électriques reçoivent des permis d'émissions de SO2 qu'elles peuvent **s'échanger**
  * Objectif : réduire les émissions de 50% à moindre coût en laissant les firmes arbitrer entre abattement et achat de permis

* .White.bg-Gold[Un tournant historique dans la politique environnementale] :
  * Passage d'une logique *command-and-control* à une logique **incitative par le marché**
  * Succès empirique : réduction des émissions de SO2 de **50% entre 1990 et 2007** à un coût inférieur aux estimations initiales

???
* Ce marché a été conçu notamment par des économistes de Resources for the Future (RFF)
* Il a inspiré la conception du protocole de Kyoto et du marché EU-ETS
* Paradoxe politique : c'est une administration républicaine qui crée le premier grand marché carbone

---
## Intégrer l'environnement dans l'économie de marché

**Le système des prix est à la fois le problème et la solution**

* .White.bg-Gold[Le marché comme idéal d'allocation des ressources]
* Mais .White.bg-Gold[l'information contenue dans le prix des biens marchands est mauvaise]
  * **Les externalités environnementales** : les prix ne reflètent pas l'ensemble des coûts imposés à la société, seulement les coûts privés

**L'objectif est alors de concevoir des mécanismes qui intègrent ces externalités dans les prix**

* Deux grandes familles d'instruments :
  * **Instruments en prix** : taxe pigouvienne, subventions
  * **Instruments en quantité** : marchés de permis d'émissions échangeables

-&gt; Paradigme qui a tenu: l'investissement dans l’innovation et la contribution à la croissance générale de l’économie des capitalistes valent bien rétribution et soumission. Une certaine redistribution des richesses, qui a permis une pacification après le WWII et le maintien de ce système.

## 2.A. L'efficacité en coût des instruments de prix

---
## Quels critères pour choisir un instrument de politique environnementale?

* Le design de la régulation doit tenir compte des **caractéristiques du problème environnemental**
  * Le **type de pollution** : polluant de flux vs. polluant de stock
  * Sources **ponctuelles** vs. sources **diffuses**
  * Le **milieu pollué** : air, eau, sol
--

* Le critère de la .White.bg-Gold[coût-efficacité]
  * Atteindre l'objectif environnemental à moindres coûts
* Les **coûts administratifs**
  * Coûts de vérification et d'application de la politique
* Le critère de l'**efficacité environnementale**
  * L'instrument atteint-il effectivement l'objectif fixé?
* Le critère de l'**équité sociale**
  * L'instrument a-t-il des impacts redistributifs?
* La **flexibilité** face à l'incertitude et aux nouveaux contextes

---
## Pourquoi les prix sont-ils à la fois le problème et la solution?

* Dans une économie de marché, **les prix guident l'allocation des ressources**
  * Les agents arbitrent entre usages en fonction des prix relatifs
* Mais **les externalités environnementales** brisent ce mécanisme :
  * Le coût imposé à la société par la pollution **n'est pas reflété dans les prix privés**
  * Les firmes polluent "gratuitement" au regard du coût social de cette pollution

--

* **Comment résoudre cette défaillance de marché?**
  1. **Définir des droits de propriété** sur la ressource environnementale: .White.bg-Gold[approche coasienne]
  2. **Corriger les prix** par une taxe ou un marché de permis: .White.bg-Gold[approche pigouvienne]

---
## L'allocation coût-efficace: le cadre d'analyse

* Un cadre simple :
  * `\(J\)` firmes qui émettent `\(e_j\)`, émissions totales : `\(E = \sum_{j=1}^{J} e_j\)`
  * Une pollution **homogène** et **ponctuelle**, produite par des firmes en situation **concurrentielle** sur leur output

* **Fonction de dommage** monétaires aggrégés :
`$$D(E), \quad D'_i &gt; 0, \quad D''_i \geq 0$$`

* **Coût d'abattement** de la firme `\(j\)` : `\(C_j(e_j)\)` avec `\(C_j(\hat{e}_j) = 0\)` et `\(C_j(e_j) &gt; 0\)` si `\(e_j &lt; \hat{e}_j\)`
  * **Coût marginal d'abattement** (*MAC*) :
`$$MAC_j(e_j) = -C'_j(e_j) &gt; 0$$`
  * **Croissant lorsque les émissions diminuent** : les premières unités réduites sont les moins coûteuses

???
* Cohérent avec les preuves empiriques : premières réductions peu coûteuses, dernières nécessitent des investissements lourds

**Comment quantifier `\(D_i(E)\)`?**

* L'entreprise subit un coût lorsqu'elle choisit un niveau de de pollution en dessous du niveau qu'elle choisirait librement (ou sans régulation), noté `\(\hat{e}_j\)`
* **Coût d'abattement**: `\(C_j(e_j)\)`
  * `\(\hat{e}_j\)`: le niveau d'émission choisi par l'entreprise sans contrainte
  * `\(C_j(\hat{e}_j)=0\)`
  * `\(C_j(e_j)&gt;0\)` si `\(e_j&lt;\hat{e}_j\)`
  * `\(C'(e_j)&lt;0\)` pour `\(e_j&lt;\hat{e}_j\)`: les coûts de l'abattements sont plus faibles quand les émissions sont grandes.
      * Le coût marginal de l'abattement (*Marginal Abatement Cost*, MAC):
      $$ MAC_j(e_j)= -C'_j(e_j)&gt;0, \ \ e_j&lt;\hat{e_j}$$
  * **Le coût marginal de l'abattement  s'accroit lorsque les émissions sont réduites**, i.e. la fonction de coût d'abattement est convexe
      * **Cohérent avec les preuves empiriques**: les premières unités d'émissions réduites sont moins coûteuses  que les dernières, car celles-ci requièrent des dépenses d'investissement en capital coûteuses et des changements de procédures de production

---
## L'allocation coût-efficace

* **Arbitrage entre les impacts négatifs de la pollution sur les ménages et les bénéfices en production/consommation permis par l'externalité**
* Le niveau socialement efficace de pollution est celui qui minimise le coût social total de la pollution:
`$$\min_{e_1,\dots,e_J}SC(e_1,\dots,e_J)= \sum_{j=1}^{J}C_j(e_j) + D(E)$$`
* Vérification des conditions du premier ordre pour chaque émission individuelle `\(e_j\)` amène aux solutions `\(e_j^*\)` et `\(E^*=\sum e_j^*\)` définies par:
`$$\begin{align} 
-C'_j(e_j^*)=D'(E^*) \ \ et \ \ -C'_j(e_j^*)=-C'_k(e_k^*) \ \ \forall \ j,k \ avec \ j\neq k 
\end{align}$$`

* Vérification des conditions du second ordre lorsque `\(C''_j(e_j^*)+D''(E^*)&gt;0\)`, ce qui est vrai par hypothèse

---

## L'allocation coût-efficace

`$$\begin{align} 
-C'_j(e_j^*)=D'(E^*) \ \ et \ \ -C'_j(e_j^*)=-C'_k(e_k^*) \ \ \forall \ j,k \ avec \ j\neq k 
\end{align}$$`

.White.bg-Gold[L'allocation coût-efficace vérifie alors la double règle ci-dessus, signifiant que:]
  * **Le coût marginal de l'abattement est égal à la valeur du dommage marginal de la pollution** 
  * **Le coût marginal d'abattement est égal pour chaque entreprise**
* Un instrument est coût-efficace **s'il fixe des niveaux de pollution  spécifiques à chaque pollueur** (chaque `\(e^{*}_j\)` est spécifique à chaque firme `\(j\)`) et **si les coûts marginaux sont égaux entre eux et correspondent au dommage marginal**

---

* En haut à gauche: coût total d'abattement pour la firme 1, en dessous coût marginal d'abattement
* A partir de `\(\hat{e}_1\)`, l'abattement est coûteux lorsqu'elle réduit ses émissions. Le Coût marginal d'abattement est faible mais positif, et croît à mesure que la firme réduit ses émissions. L'aire sous la courbe du coût marginal d'abattement est le coût total (pour `\(\bar{e}_1\)` c'est l'aire `\(a+b+c\)`)

* Pour un montant d'émission `\(E^*\)`, l'efficacité est atteinte  lorsque les deux coûts d'abattement marginaux sont égaux, et qu'ils correspond au dommage marginal. Cette efficacité est atteinte pour les niveaux individuels d'émission `\(e_1^*\)` et `\(e_2^*\)`

## Droits de propriété et théorème de Coase (1960)

* En **définissant des droits de propriété sur la ressource associée à l'externalité**...
  * Par exemple : une quantité d'émissions de polluants
* ... Et si nous évoluons dans un monde **sans coûts de transaction**...
* Alors le **problème de l'externalité est résolu** tout en atteignant l'allocation coût-efficace par la transaction des droits de propriété
* Ce résultat est de plus **indépendant de l'allocation initiale des droits de propriété**
  * **Neutralité allocative**

.center[
"Il est nécessaire de savoir si l'entreprise qui a causé le dommage est responsable ou non du dommage causé, car sans l'établissement de cette délimitation initiale des droits, il ne peut y avoir de transactions sur le marché pour les transférer et les recombiner. Mais le résultat final (qui maximise la valeur de la production) est indépendant de la situation [d'allocation juridique initiale] si l'on suppose que le système de prix fonctionne sans coût. "

(Coase, 1960)
]

???
* Coase publie "The Problem of Social Cost" en 1960
* Il illustre par l'exemple d'un agriculteur dont les cultures sont endommagées par le bétail d'un voisin
* Appelé "Théorème" plus tard par Stigler (1968)

## Les conséquences du théorème de Coase

* Ce théorème ouvre la voie vers la **possibilité de solutions négociées** face aux problèmes de pollution
  * La négociation privée des droits de propriété peut être utilisés pour résoudre efficacement les problèmes de pollution
  * Une thèse qui était jusqu'alors peu acceptée: la gestion des ressources et des pollutions étaient vue comme un problème public
  
--

* **Les conditions d'applicabilité du théorème sont strictes**:
    * **Caractère diffus + grand nombre de pollueurs engendre des coûts de transaction élevés**
    * La neutralité allocative n'existe alors que dans "un paradis sans coûts de transaction"
* Emerge lors plus tard l'idée d'un **marché de permis échangeable d'émissions**
  * Le marché réduit les coûts de transaction en centralisant les enchères, et en réduisant les coûts de transaction par rapport à une situation de "troc bilatéral" sur les droits de propriété
  * Pas de citation de l'article de Coase dans les premiers travaux sur les marchés de quotas échangeables

### Théorème de Coase: illustration par la théorie des jeux (II)


* Le régulateur définit des droits de propriété `\(E^*\)` alloués :
  * **Soit à la ville** : droit à zéro pollution, ou compensation en laissant la firme polluer jusqu'à `\(E^*\)`

**Optimum social** : le niveau de pollution qui minimise les coûts totaux:

`$$\min_{E} \ C(E) + D(E) + T \implies -C'(E^*) = D'(E^*)$$`

### Théorème de Coase: illustration par la théorie des jeux (III)

* **Formallisons une négociation en un jeu à deux étapes**
  1. la firme peut proposer un contrat (`\(E,\theta\)`) avec un niveau d'émissions `\(E\)` et un paiement `\(\theta\)`
  2. La ville accepte ou non le contract. Si acceptation, la firme ne peut pas dépasser le niveau de pollution contracté
  * Négocier le contract implique des coûts de transaction `\(T\)`
  * Hypothèses: informations parfaites sur les préférences et les coûts entre agents
--

* **Résolution**: en deuxième étape, le ménage accepte le contrat ssi `\(\theta\geq D(E)\)`, et la firme n'a pas intérêt à payer plus que ce que la ville peut accepter, connaissant ses préférences, ainsi `\(\theta = D(E)\)`
--

* La firme définit alors le niveau de pollution et le paiement qui minimise ses coûts, en remplaçant le paiement par `\(D(E)\)` (le montant minimum accepté par la ville suivant le niveau de pollution):
`$$\min_{E}TC(E)=C(E)+D(E)+T$$`
Dont la solution est définie par `\(-C'(E)=D'(E)\)`: **c'est le niveau coût-efficace** `\(E^*\)`
--

* L'échange intervient ssi `\(T&lt;C(0) - [C(E^*) + D(E^*)]\)`, c-à-d **si les coûts de transaction sont inférieurs à la différence entre le coût social en l'absence de négociation et le coût social à l'issue des négociations menant au niveau `\(E^*\)`**

## Deux exemples de négociation coasienne

* **Les mines de potasse d'Alsace** (1975)
  * Fabrication de potasse émet du chlore dans le Rhin
  * Coûts d'abattement des mines **faibles** : déchet solide entreposable loin de la rivière
  * La France, l'Allemagne, la Suisse et les Pays-Bas paient les mines **532 millions de francs** pour réduire leurs émissions

* **La source d'eau minérale Vittel** (1988)
  * Source polluée par les nitrates issus de l'épandage agricole
  * Vittel contracte avec **37 agriculteurs** du bassin versant :
    * Interdiction du maïs, des pesticides et des engrais de synthèse
    * Paiement de **230€/ha pendant 7 ans** et **150 000€ de compensation directe**

## Les limites du théorème de Coase

* La négociation bilatérale suppose des **coûts de transaction faibles**
  * En pratique : grand nombre de pollueurs, pollution diffuse, asymétries d'information `\(\rightarrow\)` coûts de transaction **élevés**
  * Les possibilités soulevées par le théorème "sont trop éloignées pour être prises au sérieux" (Mishan, 1972)

* Une **question d'équité** soulevée par les économistes :
  * La **neutralité allocative** n'est pas neutre d'un point de vue redistributif
  * "Il est plus justifiable de compenser un pêcheur pour sa perte de poissons que de demander au pêcheur de payer le pollueur pour réduire la pollution" (Kneese, 1964)

--

* Application directe du théorème de Coase reste mince à grande échelle
  * **Héritage (indirect)**: .White.bg-Gold[l'émergence des marchés de permis échangeables
  ]

Globalement, les économistes de l'environnement des années 70 questionnent la neutralité allocative. Ils ne remettent pas en doute l'idée que la négociation peut aboutir à l'allocation coût-efficace, mais que la complexité des problèmes de pollution amoindrissent son applicabilité du fait de la présence de coûts de transaction
  * les possibilités soulevées par le théorème de Coase « sont trop éloignées pour être prises au sérieux » (Mishan 1972)
  * L'idée vient alors de reproduire le marché, une situation où les coûts de transaction sont faibles

* Problème de l'équité/éthique face à une pollution dont les dommages sont intergénérationnels

* Coase est parfois convoqué pour justifier un désengagement de l'État : erreur d'interprétation
* Le théorème montre au contraire l'importance de droits de propriété bien définis et protégés

## L'optimalité des taxes pigouviennes

* L'entreprise polluante paye  une **taxe par unité d'émissions de polluant**. Ses coûts d'abattement sont alors:
$$TC_i(e_i)=C_i(e_i)+\tau e_i $$
* **Minimisation des coûts** définit la quantité d'émissions optimale pour la firme:
$$-C'_i(e_i^*)=\tau $$
      * **La firme réduit les émissions jusqu'au point où le coût marginal d'abattement est égal à la taxe**
      * On peut en déduire les émissions en fonction de la taxe à l'optimum de la firme: `\(e_i^*(\tau)\)`
      * Montant individuel de taxe payé: `\(e_i^*(\tau) \times \tau\)`
      * Fonction aggrégée d'émissions: `\(E(\tau)=\sum_{i=1}^{J} e_i^*(\tau)\)`
--

* **Si le régulateur connait `\(D'\)`, il fixe `\(\tau=D'\)` et la taxe est alors coût efficace**

---
## Comment varie les émissions en fonction de la taxe à l'optimum?

* Dépend de la .White.bg-Gold[forme des coûts d'abattement]
  * **Statique comparative de l'optimum privé de la firme:**
 $$ \begin{align}
 \dfrac{de_i(\tau)}{d\tau} = -\dfrac{1}{C''_i[e_i(\tau)]} 
 \end{align} $$
  * Si les coûts d'abattement sont **linéaires**, alors les émissions sont **indépendantes de la taxe**
  * Si les coûts d'abattement sont **convexes**, alors les émissions sont **décroissantes en fonction de la taxe**
--

* Si le régulateur connaît la forme des coûts moyens d'abattement, le régulateur peut alors atteindre n'importe quel niveau d'émissions en choisissant le niveau de taxe approprié
* Exemple de la taxe sur les émissions de SO2 en Suède et en France dans les années 90
  * Puis recyclage du revenu de la taxe pour subventionner l'investissement en technologie d'abattement

## Le cas des marchés de permis d'émissions échangeables

* Le régulateur fixe une **quantité totale d'émissions**
  - Idéalement `\(E^*\)`, le niveau de pollution optimal
  
--

* Chaque firme **obtient un permis d'émissions**
  * Elle peut en acheter d'autres ou le vendre sur le marché
  * Ses émissions finales doivent correspondre à ce que ses permis détenus lui autorisent

## Les marchés de permis d'émissions

* **Quantité totale fixe de permis `\(L\)`**, déterminée par le régulateur (avec `\(L \gtreqqless E^*\)`) 
* **Prix qui émerge du marché `\(\sigma\)`**
  * Faisons abstraction des problèmes d'enchère sur ces marchés et supposons qu'un prix unique d'équilibre `\(\sigma\)` émerge
* La firme minimise ses coûts totaux de pollution, qui incluent les coûts d'achats de permis:
`$$TC_i(e_i)=C_i(e_i)+\sigma e_i$$` 

$$\text{CPO:} \ \  -C'_i(e_i^*)=\sigma $$
* On peut également déduire les émissions à l'optimum en fonction du prix (fonction implicite déterminée à partir de la CPO): `\(e_i^*(\sigma)\)`
  * **C'est la demande de permis de la firme `\(i\)`**
  * Demande aggrégée de permis: `\(E(\sigma)=\sum_{i=1}^{J} e_i^*(\sigma)\)`
  * Prix d'équilibre déterminé par `\(E(\sigma)=L\)`
--
  
* **Si le régulateur connait `\(E^*\)`, il fixe alors `\(L=E^*\)` et le marché est un instrument coût efficace** (sous hypothèse que ce marché est en concurrence pure et parfaite)

* Taxe et marché de permis **égalisent tous deux les coûts marginaux d'abattement** entre firmes

## Quand les marchés ne sont pas concurrentiels

* La plupart des industries régulées opèrent en **monopole ou oligopole** :
  * Production d'électricité, d'acier, d'aluminium, de pétrole...

* Les résultats précédents supposaient la concurrence pure et parfaite : **ils ne tiennent plus**

* Le régulateur doit alors chercher un **optimum de second rang** qui équilibre deux distorsions simultanées :
  1. L'**externalité de pollution**
  2. Le **pouvoir de marché** (sous-production par rapport à l'optimum social)

* Exemple d'un monopole :
  * Une taxe pigouvienne **aggrave la sous-production** déjà induite par le monopole
  * Le montant optimal de taxe sur les émissions doit alors être **inférieur au dommage marginal**, pour ne pas aggraver la sous-production et les prix élevés induit par le monopole

## Un example : le pouvoir de marché de l'OPEP

* **De Loecker, Eeckhout &amp; Unger (2020)** documentent une hausse généralisée des pouvoirs de marché depuis les années 80
  * Les *markups* (marges prix/coût marginal) ont fortement augmenté dans de nombreux secteurs

* **L'OPEP comme exemple d'une industrie polluante avec pouvoir de marché** : un cartel pétrolier qui restreint volontairement l'offre
  * Cette restriction de l'offre **réduit mécaniquement les émissions** de GES liées à la combustion du pétrole
  * Le pouvoir de marché de l'OPEP a ainsi pu constituer un **frein involontaire aux émissions**
  * .White.bg-Gold[Paradoxe] : une distorsion de marché produit partiellement l'effet d'une taxe carbone

* **Implication pour la politique environnementale** :
  * En présence de pouvoirs de marché, le niveau optimal d'une taxe environnementale doit tenir compte de **l'ensemble des distorsions existantes**
  * ["Two wrongs can sometime make a right"](https://www.nber.org/system/files/working_papers/w33115/w33115.pdf?stream=top): les pouvoirs de marché de l'OPEC ont induit un ralentissement des émissions par rapport à une situation concurrentielle

## Bilan : les instruments au crible des critères de sélection

| Critère | Réglementaire | Accord coasien | Taxe | Marché de permis |
|---|---|---|---|---|
| **Coût-efficacité** | ✗ sauf si firmes homogènes | ✓ si coûts de transaction faibles | ✓ si `\(\tau = D'\)` connu | ✓ si `\(L = E^*\)` connu |
| **Efficacité environnementale** | ✓ certaine | ✓ | ✗ incertaine | ✓ certaine |
| **Coûts administratifs** | Modérés | Élevés (frais juridiques) | Modérés | Modérés |
| **Flexibilité** | Faible | Faible | Moyenne | Élevée (banque de permis) |
| **Équité** | Incertaine | Dépend de l'allocation | ✓ si revenu redistribué | ✓ si enchères |

.White.bg-Gold[Conclusion] : les instruments en prix (taxe, marché de permis) dominent sur le critère de coût-efficacité, mais **leur efficacité en pratique dépend de leur design et du contexte de marché**

* **Vers la *neutralité carbone* **
  * L'offre de permis serait possiblement nulle à horizon 2040 si l'on poursuit les tendances
  * Penser l'organisation et la régulation des marchés dans cette perspective

## 2.C.  Des instruments de prix au service de la croissance verte

---
## Une vision incrémentale de la transition

* Les instruments en prix modifient **les prix relatifs à la marge**
  * Renchérir les activités polluantes, rendre les activités propres plus compétitives
  * Réallouer progressivement le capital productif vers des activités moins intensives en ressources

* Cette logique suppose autant d'instruments qu'il y a d'**externalités environnementales**
  * Une taxe carbone pour les GES, une taxe sur les nitrates pour l'eau...
  * Un cadre de régulation complet et cohérent : .White.bg-Gold[rarement réalisé en pratique]

* .White.bg-Gold[Hypothèse sous-jacente] : le marché reste le moteur de l'allocation des ressources
  * L'État **corrige les défaillances à la marge**, sans remettre en cause le paradigme de croissance
  * C'est le choix d'une **transition incrémentale**, par opposition à une transition en profondeur

???
-&gt; Opposé à l'approche de Georgescu-Rogen vue au chapitre 1
-&gt; Croyance dans le marché pour continuer à allouer les ressources tout en modifiant les incitations

---
## Le paradigme de la croissance verte

.White.bg-Gold[Définition] : maintenir une **croissance de la production de biens et services tout en réduisant les conséquences écologiques de l'activité économique**

* Repose sur l'hypothèse du **découplage** :
  * .White.bg-Gold[La capacité d'une économie de croître sans accroître les pressions environnementales]
  * Possible si le capital productif utilise de moins en moins de ressources et est de moins en moins polluant
  *  **C'est la manifestation dynamique de l'hypothèse durabilité faible** : si le capital technologique peut se substituer au capital naturel, alors il est possible de produire à partir d'un capital technologique accumulé qui consomme de mois en moins de ressources naturelles et génére de moins en moins de pollution
--

* Les deux leviers technologiques principaux de la croissance verte:
  1. **Améliorer l'efficacité de l'utilisation des ressources** : économiser l'énergie, recycler les matériaux
  2. **Orienter le progrès technique** vers des technologies propres

---
## Le progrès technique dirigé comme mécanisme central

* Le **progrès technique** est le mécanisme qui concilie développement et transition :
  * Former des travailleurs adaptés aux enjeux de la transition
  * Faire émerger des technologies plus économes en ressources

* Les **modèles de progrès technique dirigé** (*directed technical change*) formalisent cette idée :
  * La recherche peut être **orientée** vers le secteur propre par des instruments de politique économique
  * Deux distorsions justifient l'intervention publique simultanée :

| Distorsion | Instrument |
|---|---|
| Externalité environnementale (négative) | Taxe sur les émissions |
| Externalité de connaissance (positive) | Subvention à la R&amp;D propre |

* .White.bg-Gold[Une taxe carbone seule est insuffisante] — elle doit être **combinée** à un soutien à l'innovation propre

---
## Le modèle AABH : *The Environment and Directed Technical Change*

&lt;a name=cite-acemoglu&gt;&lt;/a&gt;[Acemoglu, Aghion, Bursztyn, and Hemous (2012)](#bib-acemoglu) — Acemoglu, Aghion, Bursztyn, Hémous (2012)

* Modèle à **deux secteurs** : .White.bg-MyGreen[propre] et .White.bg-DarkRed[sale]

* Le progrès technique est **endogène** : la recherche se fait dans le secteur le plus profitable
  * .White.bg-Gold[*Build on the shoulders of giants*] : la recherche est plus facile dans le secteur déjà le plus avancé
  * Sans intervention : l'innovation reste dans le secteur .White.bg-DarkRed[sale], historiquement dominant

* L'intervention publique **redirige l'innovation** :
  * Une subvention à la R&amp;D propre crée une avance technologique dans le secteur .White.bg-MyGreen[propre]
  * Une fois cette avance suffisante, le progrès technique bascule spontanément vers le .White.bg-MyGreen[propre]
  * **L'intervention peut être temporaire** si les biens propre et sale sont substituables

---
## Les leçons de politique économique du modèle AABH

.pull-left[
* **Intervention immédiate nécessaire**
  * Sans intervention, l'innovation reste dans le secteur .White.bg-DarkRed[sale] par **dépendance au sentier**
  * Plus l'avance du secteur .White.bg-DarkRed[sale] est grande, plus le coût du rattrapage est élevé

* **Combinaison des deux instruments**
  * Taxe carbone + subvention R&amp;D propre : complémentaires, pas substituables
]

* L'extraction minière génère des **conflits sociaux et environnementaux locaux** intenses
* Le phénomène **NIMBY** (*Not In My Backyard*) :

  * Mais **oppositions locales fortes** contre les nuisances : projets miniers Emili et Ageli en France
* La sobriété en matériaux réduirait ces tensions, mais **elle n'est pas compatible avec le paradigme de la croissance verte**

## L'inertie du capital et les actifs échoués

* La croissance verte suppose une **réallocation rapide du capital** vers les technologies propres
* Mais une grande partie de la richesse mondiale est ancrée dans des **infrastructures fossiles** :
  * Centrales à charbon, pipelines, véhicules thermiques, compétences liées au secteur "brun"
--

* La transition implique une **dévalorisation massive des actifs fossiles** (*stranded assets*) :
  * ~2 500 milliards $ par an d'actifs à échouer au niveau mondial (Pisani-Ferry &amp; Mahfouz, 2023)
  * Forte résistance politique, financière et sociale → **retarde la transition**
--

* .White.bg-Gold[Un dilemme fondamental] :
  * Transition **rapide** → risque de crise financière et sociale
  * Transition **lente** → insuffisante face à l'urgence des crises écologiques
* .White.bg-Gold[Le marché ne peut pas résoudre ce dilemme seul] : les compagnies fossiles ont intérêt à maximiser leurs flux de trésorerie plutôt qu'à pivoter vers les renouvelables

---
## L'acceptabilité sociale des instruments en prix

* La **régressivité** des instruments en prix fragilise leur acceptabilité politique

* La **taxe carbone est régressive** :
  * Les ménages modestes consacrent une part plus grande de leur budget aux biens à forte intensité carbone
  * L'impact de la taxe est proportionnellement plus fort sur les bas revenus
  * Voir  pour une simulation des effets redistributifs

* .White.bg-Gold[La régressivité crée des résistances politiques] :
  * Les ménages soutiennent des politiques fiscales progressives
  * **Biais cognitifs** : tendance à surestimer le coût net de la taxe, même avec redistribution
  * &lt;a name=cite-douennea&gt;&lt;/a&gt;[Douenne and Fabre (2022)](#bib-douennea) : les croyances sur la régressivité se sont accrues après le mouvement des **Gilets Jaunes**

* **L'information améliore l'acceptabilité** : ([Dechezleprêtre, Fabre, Kruse et al., 2025](#bib-dechezlepretre)) montrent l'importance d'informer sur le changement climatique et les politiques climatiques pour obtenir le soutien des citoyens

---
## Ce que la croissance verte implique

* A minima, la croissance verte exigerait alors une régulation totale des impacts environnementaux, pour que les marchés
Cela semble ambitieux de penser que l'on puisse réguler tous les impacts environnementaux
* Mettre une valeur sur tous les dommages
* Etre capable d'imposer une taxe et de valoriser cette taxe à la juste hauteur
* Etre capable de faire respecter la taxe
* Etre capable de faire accepter ces taxes


---
## Bilan : les limites du paradigme de la croissance verte

* .White.bg-Gold[Ce que le paradigme apporte] :
  * Un cadre pour orienter le progrès technique via des instruments de marché
  * Des preuves empiriques de l'innovation dirigée (Popp, Aghion et al.)
  * Des gains technologiques dans les renouvelables permis par les mécanismes de learning by doing, d'effets d'échelle...

* .White.bg-Gold[Ce que le paradigme ne résout pas] :
  * Pas de découplage absolu — effets rebond (paradoxe de Jevons)
  * Une focale sur le carbone qui oublie les autres crises : matériaux, biodiversité, NIMBY
  * Des actifs échoués que le marché ne peut pas gérer spontanément
  * Une acceptabilité sociale fragile des instruments en prix

* .White.bg-Gold[Ce que le paradigme suppose sans le questionner] :
  * Que la croissance économique reste l'objectif central
  * Que le marché, corrigé à la marge, peut organiser seul la transition

???
* Est-ce alors toujours via un marché qui garde ses facultés de coordonner des acteurs économiques libres de manière efficace que l'on peut espérer transitioner?

* N'a-t-on pas alors pas plutôt intérêt à quitter le paradigme du marché libre pour contraindre les agents économiques à atteindre des objectifs environnementaux fixés par le régulateur?

* Est-ce cela la planification?

---
## Vers la planification : dépasser le paradigme de la croissance

* Le paradigme de la croissance verte repose sur un **pari technologique risqué**
  * Un découplage absolu requiert des innovations très rapides sur des horizons longs
  * Il laisse entières les crises écologiques au-delà du carbone
--

* Construire un **nouveau paradigme collectivement acceptable** requiert plus que des corrections de prix :
  1. **Définir des objectifs collectifs** que le marché seul ne peut pas produire
  2. **Aligner les intérêts individuels** sur ces objectifs collectifs
  3. **Coordonner les investissements** à une échelle et un rythme incompatibles avec les seuls signaux de marché
  4. **Gérer les actifs échoués** et la transition juste pour les travailleurs des secteurs bruns
--

* .White.bg-Gold[La planification pourrait alors jouer un rôle clef] :
  * Elle dépasse la logique incrémentale pour engager une **transformation structurelle**
  * Si démocratique, elle permet de **faire adhérer les acteurs économiques** à des objectifs socialement préférés

→ C'est l'objet de la section 3.

## 3.A. Planification vs. marché : dépasser le clivage

---
## Définir la planification économique

.White.bg-Gold[Définition] : processus qui fixe des **objectifs à atteindre** dans le temps long, les **moyens nécessaires**, les **étapes de réalisation** et les **méthodes de suivi**

* Un gradient entre deux pôles :

| | **Planification impérative** | **Planification indicative** |
|---|---|---|
| Modèle | Gosplan soviétique | Commissariat au Plan français |
| Mécanisme | Quotas de production imposés | Objectifs orienteurs, concertés |
| Propriété des moyens | État | Mixte (public/privé) |
| Place du marché | Supprimée | Maintenue et orientée |

* .White.bg-Gold[Une grande diversité de formes intermédiaires] : planification contractuelle yougoslave, État stratège chinois, agences de mission (DARPA), planification sectorielle

* La planification écologique s'inscrit dans un registre **indicatif et démocratique**: elle n'abolit pas le marché, elle **oriente les investissements** là où les signaux de prix sont insuffisants

???
-&gt; Souligner que le débat marché/planification est souvent caricaturé. Le vrai enjeu est : quelle combinaison, pour quels objectifs ?

---
## Pourquoi le marché seul échoue face à la transition

* La transition écologique présente des **caractéristiques structurelles** que le marché ne peut pas gérer seul :

--

  1. **Horizon temporel incompatible** : les marchés valorisent le court terme ; la transition écologique exige des engagements sur 30 à 50 ans que les acteurs privés ne peuvent pas prendre seuls

--

  2. **Des externalités si nombreuses qu'une centralisation peut permettre une meilleure coordination des investissements complémentaires** : une voiture électrique ne vaut rien sans réseau de recharge ; les panneaux solaires supposent un réseau adapté → des externalités de réseau que le marché sous-produit

--

  3. **Gestion des actifs échoués** : ~2 500 milliards $ par an d'actifs fossiles à dévaloriser (Pisani-Ferry &amp; Mahfouz, 2023) → aucun acteur privé n'a intérêt à organiser sa propre dépréciation

--

  4. **Biens publics et communs (climat, biodiversité, eau)**: ces ressources ne sont pas privatisables et leur protection ne génère pas de profit

--

  5. **Transition juste** : la réallocation des travailleurs des secteurs bruns vers les secteurs verts ne peut pas être laissée au seul jeu des marchés du travail

## Hayek : ce que la planification ne peut pas faire

**F.A. Hayek, *La route de la servitude* (1944)**

* .White.bg-Gold[Argument économique central] : la planification centralisée est impossible parce que le savoir économique est **dispersé et tacite**
  * Les prix agrègent des millions d'informations locales que nul planificateur ne peut centraliser
  * L'état ne peut pas connaître les coûts de production de chaque firme, ni les préférences de chaque consommateur
  * [La météphore du crayon de M. Friedman](https://www.youtube.com/watch?v=67tHtpac5ws)
--

* .White.bg-Gold[Argument politique] : la planification est **autoritaire** `\(\rightarrow\)` impose un code de valeurs collectif

--
* **Qu'est-ce que cela implique pour la planification écologique ?**

## Une voie sans marché ni planification centrale : la gouvernance des communs (Ostrom)

**Elinor Ostrom (1990), *Governing the Commons*** — Prix Nobel d'économie 2009

* La théorie conventionnelle propose deux solutions aux ressources communes :
  1. **Privatisation** → droits de propriété privée
  2. **Étatisation** → gestion centralisée

--

* Ostrom montre empiriquement que **des communautés d'individus ont géré durablement des ressources communes sans État ni marché** :
  * Systèmes d'irrigation (Espagne, Bali), pâturages de montagne (Suisse, Japon), pêcheries côtières

* **Principes clés de gouvernance** : règles adaptées au contexte local, participation des usagers, surveillance mutuelle, sanctions graduées et légitimes

--

* .White.bg-Gold[Application à la transition] : certains biens écologiques se gèrent mieux par des **communautés d'usagers** que par des prix ou l'État central
  * Bassins versants, forêts communales, biodiversité locale
  * .White.bg-Gold[Limites] : difficilement généralisable aux biens globaux (climat, océans) → nécessite malgré tout une coordination étatique internationale

---
## Marché, État, communs : quelle combinaison ?

.White.bg-Gold[La question n'est pas « marché ou planification » mais quelle combinaison pour quels objectifs]

| Domaine | Outil adapté | Raison |
|---|---|---|
| Efficacité allocative à la marge | Marché + instruments de prix | Information décentralisée (Hayek) |
| Investissements de long terme | Planification publique | Horizon incompatible avec le marché |
| Innovation technologique propre | Agences de mission + subventions | Double externalité (AABH) |
| Gestion des actifs échoués | État | Aucun acteur privé n'a d'incitation |
| Protection des travailleurs | Droits sociaux + planification | Justice sociale |

* Le capitalisme, en pratique, n'a jamais fonctionné sans planification : Plan Marshall, plans Monnet, IRA américain, plans quinquennaux chinois

## 3.B. Les enseignements des expériences passées de planification

---
## Trois expériences emblématiques

.White.bg-Gold[Pourquoi ces trois cas ?] Aucune n'est une planification écologique, mais chacune illustre des mécanismes généraux transposables

| Expérience | Type | Succès | Limites |
|---|---|---|---|
| **Programme Apollo** (1961–1969) | Mission publique ciblée | Objectif atteint en 8 ans | Coûts massifs, peu transférable au marché |
| **Planification soviétique** (1928–1991) | Impérative, sans marché | Industrialisation rapide à court terme | Inefficacité, pénuries, désastre écologique |
| **Plan Monnet — France** (1946–1970) | Indicative, avec marché | Modernisation et croissance réussies | Devient symbolique à partir des années 70 |

* **Leçon transversale** : la planification réussit quand elle **fixe des objectifs clairs** avec des **moyens coordonnés**, sans chercher à remplacer entièrement les mécanismes de marché

---
## Le programme Apollo : la logique de « mission »

* En **1961**, Kennedy annonce l'objectif : *envoyer un homme sur la Lune avant la fin de la décennie*
  * Un objectif technologique **clair, mesurable, temporellement défini**
  * Budget : ~25 milliards de dollars (≈ 150 milliards en valeur actuelle)
  * Au pic : 400 000 personnes mobilisées, 20 000 entreprises sous-traitantes
--

* **Ce que Apollo enseigne — la logique de mission** (Mazzucato, *Mission Economy*, 2021) :
  * L'État **fixe un problème à résoudre**, le secteur privé développe les solutions
  * Il ne "choisit pas les vainqueurs" — il crée les conditions technologiques
  * Les **technologies de retombée** (*spin-offs*) sont considérables : microprocesseurs, matériaux composites, imagerie médicale, GPS
--

* .White.bg-Gold[Application à la transition écologique] :
  * Des missions de type Apollo sont envisageables : « neutralité carbone du bâtiment en 2040 », « 100% d'électricité bas carbone en 2035 »
* L'IRA américain (2022) s'inspire directement de cette logique : 369 milliards de subventions ciblées et effet de levier espéré
* .White.bg-DarkRed[Limite principale] : la transition écologique est **multidimensionnelle et socialement controversée** — qui définit l'objectif ? comment répartir les coûts ?

---
## La planification soviétique : une faillite instructive

* **Contexte** : **Gosplan** créé en 1921 ; plans quinquennaux de 1928 à 1991
  * Industrialisation réelle : production d'acier ×10 entre 1928 et 1940
--

* **Problèmes structurels** :
  * **Absence de prix** → impossible de connaître les coûts relatifs et les raretés
  * **Incitations perverses** : les quotas quantitatifs → produire de la mauvaise qualité pour "remplir le plan"
  * **Charge informationnelle incommensurable** : le Gosplan ne peut traiter toutes les interdépendances
  * **Rigidité** : incapacité à s'adapter aux chocs imprévus
--

* **Tentative d'éliminer la monnaie** → échec :
  * Les ménages et entreprises recherchent la monnaie pour elle-même — elle est irremplaçable comme signal de rareté
  * Dès les années 1920, l'URSS réintroduit la monnaie
--

* **Un désastre écologique emblématique : la mer d'Aral**
  * Décision centrale d'irriguer massivement le coton: la mer a perdu 90% de sa surface (1960–2000)
  * .White.bg-Gold[Paradoxe] : la planification centralisée a souvent davantage dégradé l'environnement que le marché, parce que les objectifs de production primaient sur tout

---
## La planification française : succès et déclin

* **1946** : Commissariat général au Plan fondé par **Jean Monnet**
  * Concentration sur **6 secteurs** : charbon, électricité, ciment, acier, agriculture, transports
  * Nature **indicative et concertée** : État, syndicats, patronat, experts co-construisent le plan
  * Fléchage des crédits du **Plan Marshall** et réorganisation du système financier au service des objectifs
--

* **Clés du succès** (Peaucelle, 2005 ; Monnet, 2018) :
  * Horizon quinquennal dépassant le court-termisme des marchés
  * **Coordination des investissements** entre secteurs interdépendants (l'acier suppose l'énergie, qui suppose les transports...)
  * Le plan **n'abolit pas le marché** `\(\rightarrow\)` il l'oriente, notamment via le crédit public
--

* **Déclin progressif** :
  * Caractère prescriptif s'amenuise à partir des **années 1970** avec la montée des marchés financiers
  * 2006 : transformation en Centre d'analyse stratégique `\(\rightarrow\)` **think tank**, non planificateur
  * Aujourd'hui : **SGPE** (Secrétariat Général à la Planification Écologique, 2022) coordination sans moyens contraignants

???
-&gt; Bonne illustration de complémentarité plan/marché : le plan Monnet fonctionne en orientant le marché sans le supprimer. Il décline quand les marchés financiers mondiaux deviennent trop puissants pour être orientés par le seul levier national.

## À quoi ressemblerait une vraie planification écologique ?

.White.bg-Gold[Mathilde Viennot, *La planification écologique* (La Découverte, 2024)]

* La France dispose déjà d'outils programmatiques :
  * **SNBC** : trajectoires sectorielles d'émissions
  * **PPE** : mix énergétique à horizon 10 ans
  * **PNACC** : adaptation au changement climatique
  * **SGPE** (2022) : coordination entre ces stratégies

* .White.bg-DarkRed[Mais ces outils ne planifient pas vraiment] :

  * **Cloisonnement** : les stratégies climat, biodiversité, eau ne sont pas coordonnées
  * **Pas de projection opérationnelle** : les feuilles de route ne sont pas assorties de financements garantis
  * **Absence de suivi contraignant** : certains rapports de suivi défavorables ne sont pas rendus publics

## Les scénarios comme outil de la planification écologique

* Le plan repose sur des **scénarios**, pas des prévisions — ils ouvrent un espace de **choix collectif**

* **Exemple : les scénarios ADEME** (Transition(s) 2050) : quatre chemins, objectif LT identique, arbitrages très différents

]

* Les scénarios permettent de **rendre visibles les arbitrages** :
  * Quelle réduction de mobilité automobile ?
  * Quel mix nucléaire/renouvelable ?
  * Quel niveau de sobriété alimentaire ?
  * → Ce sont des **choix politiques**, pas des optimums techniques

---
## Les 5 rôles de l'État dans le financement de la transition

À partir de Viennot (2024) et Pisani-Ferry &amp; Mahfouz (2023) :

| Rôle | Mécanisme | Exemple contemporain |
|---|---|---|
| **1. Trésorier** | Finance directement par impôt ou dette | Grand emprunt national, NextGenerationEU |
| **2. Compensateur** | Prend les pertes, laisse les gains au privé (*derisking*) | Garanties publiques aux investisseurs verts |
| **3. Architecte** | Coordonne les banques publiques, oriente le crédit | BPI, Caisse des dépôts, assouplissement quantitatif vert |
| **4. Co-investisseur** | Investit aux côtés du privé, partage risques et gains | IRA américain, prises de participation dans les énergies |
| **5. Prescripteur** | Réglemente, contraint le privé à financer la transition | Taxonomie verte, verdissement des bilans bancaires |

* Ces rôles s'appliquent différemment selon les **trois types d'investissements** :
  * **Rentables** (solaire) → co-investisseur / compensateur
  * **Rentabilité incertaine** (véhicules électriques, hydrogène) → architecte + prescripteur
  * **Non rentables** (fret ferroviaire, adaptation) → trésorier

---
## Les ordres de grandeur du financement

* Besoin additionnel estimé : **2–3% du PIB européen par an**, soit ~400 milliards €
  * En France : **66 Md€ par an** d'ici 2030, soit 2,3% du PIB (Pisani-Ferry &amp; Mahfouz, 2023)
  * Ces chiffres **sous-estiment** les besoins : biodiversité, transition juste, financement pays du Sud, R&amp;D, démantèlement des actifs échoués

--

* **L'épargne existe** : 1 390 milliards d'euros en Europe (Draghi, 2024)
  * Le défi n'est pas l'absence de capitaux — c'est leur **mauvaise orientation**
  * Rôle central de la planification : **réorienter ces flux**

--

* .White.bg-Gold[Argument macroéconomique décisif] :
  * Le coût de l'inaction climatique excède très probablement le coût de la transition (Bilal &amp; Känzig, 2024)
  * La transition pourrait donc s'autofinancer à l'échelle macroéconomique sur longue période
  * L'emprunt public pour financer la transition est économiquement justifiable — comme l'étaient les emprunts pour les grands travaux publics ou la reconstruction d'après-guerre

## Au-delà de la croissance verte : d'autres paradigmes

---
## Trois paradigmes alternatifs

.White.bg-Gold[La croissance verte n'est pas le seul paradigme possible pour la transition]

| Paradigme | Rapport à la croissance | Instrument central  |
|---|---|---|
| **Décroissance** | Réduction volontaire de la production | Planification démocratique des besoins |
| **Post-croissance** | Transition au-delà du PIB comme objectif | Indicateurs alternatifs + planification sectorielle |
| **A-croissance** | Indifférence au PIB — focaliser sur le bien-être | Institutions et normes sans viser de taux de croissance |

* Ces trois paradigmes partagent une conviction : **le marché, même corrigé, ne peut pas organiser seul une transition profonde**
* Tous impliquent une **forme de planification** : des besoins, des investissements, des normes

---
## La décroissance : planifier la réduction

* **Serge Latouche, Ivan Illich, André Gorz** (années 1970–2000), **Giorgos Kallis**
* **Thèse** : la crise écologique est insolvable dans le cadre d'une économie orientée vers la croissance
  * La technique autonome prive les individus de leur agentivité (Illich, *Énergie et équité*, 1973)
  * La croissance crée des **besoins artificiels** qu'elle prétend ensuite satisfaire → aliénation et surexploitation du milieu
--

* **Ce que la décroissance implique concrètement** :
  * Réduction de la production dans les secteurs à forte empreinte : automobile, aviation, viande industrielle
  * Réduction du temps de travail → partage du travail et du revenu
  * Relocalisation des productions → réduction des chaînes logistiques mondiales
--

* .White.bg-Gold[Limite principale] : la décroissance est essentiellement un **programme négatif**
  * Elle dit ce qu'il faut réduire, moins ce qu'il faut construire
  * Question politique centrale : qui décide de quoi réduire ? Comment éviter que ce soient toujours les mêmes qui supportent le coût ?
  * Risque d'une **décroissance subie** pour les plus vulnérables sans mécanismes redistributifs explicites

---
## La post-croissance et l'économie du donut

* **Tim Jackson** (*Prosperity Without Growth*, 2009) et **Kate Raworth** (*Doughnut Economics*, 2017)
* **Thèse** : le PIB est un mauvais indicateur de bien-être — et un objectif de politique économique obsolète
  * Le PIB comptabilise positivement la pollution, les accidents, les maladies du stress
  * Il ignore les activités de soin, la nature, la cohésion sociale
--

* **La proposition de Raworth : l'économie du donut**
  * Un **plancher social** : éducation, santé, logement, alimentation — en dessous duquel nul ne doit descendre
  * Un **plafond écologique** : les neuf limites planétaires — au-delà duquel on déstabilise la biosphère
  * L'objectif : rester dans l'**espace sûr et juste** entre les deux

--
* **Implications pour la planification** :
  * Substituer aux règles macroéconomiques (déficits, croissance du PIB) des **indicateurs de bien-être et d'empreinte**
  * Planifier les secteurs pour respecter les limites planétaires — non pour maximiser la production

---
## L'a-croissance

* **Jeroen van den Bergh**
* **Thèse** : ni croissance ni décroissance ne sont des objectifs — il faut devenir **indifférent au PIB**
  * Abandonner le PIB comme indicateur de succès
  * Si les bonnes institutions sont en place, le PIB peut augmenter ou diminuer — ce n'est plus l'objectif à piloter
--

* **Avantage par rapport à la décroissance** :
  * L'a-croissance n'impose pas de réduction — elle laisse les arbitrages ouverts
  * Une croissance **qualitative** (soins, éducation, services) peut coexister avec une décroissance **matérielle**
--

* **Ce que l'a-croissance implique** :
  * Réforme des règles macroéconomiques (abandon des règles de croissance du PIB dans les traités budgétaires)
  * Planification centrée sur des **objectifs de bien-être et d'empreinte écologique** — non sur le taux de croissance
  * Réorientation des transferts sociaux vers les services à faible empreinte

---
## Bilan : trois paradigmes, une question commune

.White.bg-Gold[Peut-on organiser une économie soutenable sans que la croissance du PIB en soit l'objectif ?]
--

* Sur le plan **économique** :
  * La croissance verte parie sur le découplage absolu qui n'est pas observé
  * Décroissance/post-croissance/a-croissance reconnaissent la **limite physique** des ressources
--

* Sur le plan **politique** :
  * Ces paradigmes impliquent tous une **planification démocratique** : quelqu'un doit décider des priorités, des arbitrages, des secteurs à développer et à réduire
  * Ils ne fonctionnent pas avec de simples corrections de prix
--

* Sur le plan **social** :
  * La **transition juste** est centrale : comment s'assurer que les coûts ne pèsent pas sur les plus vulnérables ?
  * C'est le lien avec la planification : la redistribution ne peut pas être laissée au marché
