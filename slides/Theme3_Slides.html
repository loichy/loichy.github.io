## Objectifs du chapitre

Chapitres précédents sur le **croissance verte** et l'**analyse économique du changement climatique** mettent en avant .White.bg-Gold[quels objectifs souhaitent atteindre les politiques environnementales].

Ce chapitre aborde les **instruments de politique environnementale**: qui permettent d'atteindre ces objectifs.
  * .White.bg-Gold[Comment atteindre ces objectifs?]

---
## Les instruments de politique environnementale

* Les instruments **règlementaires** ("*command-and-control*" en anglais)
  * Normes et standards
  * Interdictions
  * Responsabilité élargie du producteur

* Les **taxes sur les émissions** de polluant

* Les **permis d'émission échangeables**  (ou droits à polluer échangeables)

* Les **subventions environnementales**

---
## Quels critères pour choisir un instrument de politique environnemental?

* Le design de la régulation doit tenir compte des **caractéristiques du problème environnemental**
  * Le **type de pollution**: polluant de flux vs. polluant de stock
  * Sources ponctuelles vs. sources diffuses
  * Le milieu pollué: l'air, l'eau et le sol
* Le critère de la **coût-efficacité**
  * Atteindre l'objectif à moindres-coûts
* Les **coûts administratifs**
  * Les coûts de vérification et d'application de la politique
* L'**efficacité environnementale**
* Le critère de l'**acceptabilité sociale** ou **l'équité sociale**
  * Les instruments ont des impacts redistributifs
  * L'économiste doit interroger les effets redistributifs des instruments employés
* Tenir compte des **horizons temporels**, et de la **flexibilité**

???
* Quels critères vous semblent les plus importants pour choisir un instrument de politique environnementale?
* Enjeux: aborder les travaux classiques en éco de l'environnement sur l'efficacité des instruments en prix. Sous quels conditions des instruments sont efficaces.
* Aborder les travaux plus récents des économistes visant à comprendre pourquoi les instruments proposés ne sont pas adoptés ou mis en oeuvre.

* Dans les années 80, la plupart des pays développés se dotent alors d'**un ministère de l'environnement**

## 1.1. Une histoire courte (suite)

* De manière concomitante à cette croissance de la prise de conscience, les économistes interrogent les politiques environnementales
  * Ces analyses économiques de l'environnement sont alors **construites à partir de la théorie des externalités**: .White.bg-Gold[approche pigouvienne pour internaliser les dommages de la pollution]
  * Naissance du champ de l'**économie de l'environnement** dans les années 1960

* **Peu d'influence des économistes dans ces prémisces** de la politique environnementale:
  * Par exemple: élimination complète de la pollution comme objectif du Clean Water Act (1972) 

* **Influence des économistes de l'environnement croissante à partir des années 1990**
  * Pour affiner les règlementations existantes et en créer des nouvelles
  * L'exemple du **marché des permis d'émissions de SO2** aux Etats-Unis en 1990

---
## 1.2. Les problèmes de pollution majeures

* Catégorisation des pollutions en fonction:
  * Du **milieu**:
      * Air, eau, terre
  * Du **secteur responsable**:
      * Industrie, agriculture, transport
  * Du **type de source**:
      * Source ponctuelle vs. source diffuse
  * De leurs **conséquences**:
      * Santé humaine, biodiversité, productivité, aménités, conservation
* Importance de bien **caractériser la pollution** pour l'économiste:
  * Exposition hétérogènes des populations
  * Impacts hétérogènes sur les individus
  * Autant d'éléments qui vont affecter la forme des variations de bien-être, .White.bg-Gold[LA mesure clef dans les critères de décision des économistes]
* Importance de l'**écologie** pour caractériser ces aspects des pollutions, en tant que discipline qui analyse les écosystèmes comme unité spatiale faite d'entités vivantes et non-vivantes complexes interdépendantes

???

* Pollution ponctuelle: source de la pollution approximée mathématiquement par un unique point dans l'espèce. Exemple: un déversement de polluant dans l'eau par une usine
* Pollution diffuse: une multitude d'aléas dispersés dans l'espace et dans le temps rendant l'identification de la source de pollution difficile. Exemple: les pesticides dans l'eau, dont la pollution ne peut pas être attribué à un agriculteur en particulier

---
## La pollution de l'eau

**Le cas des eaux de surface**

* Polluants organiques issus des eaux usés
* Excès de nutriments azoté (N) et phosphoré (K): eutrophication lié à l'élevage
* Métaux lourds issus de l'industrie

---
## La pollution de l'air
* Polluants notoirement dangereux:
  * Amiante, arsenic, benzène, plomb, mercure, naphtalène, radon, etc.
  * Connus pour être cancérigènes
  * Pas de niveau de seuil d'exposition minimum sans risque
  * Sources: construction/démolition, industries chimiques

* Pollution de l'air conventionnelle:
  * Issue de la combustion de carburants fossiles
  * Dioxide de souffre, d'azote, particules fines, etc.
  
* Les gaz à effets de serre

---
## La pollution des sols

* Les déchets dangereux:
  * Les déchets industriels et ménagers
  * Les déchets radioactifs
  
* L'altération des paysages:
  * Affecte les services récréatifs, la biodiversité, la productivité des terres
  * Par exemple: déforestation, mines

* .White.bg-Gold[Source]: brûlage de combustibles fossiles génèrent des émissions de SO2

## 2.1. Le cadre standard d'évaluation de la politique environnementale

* Un **cadre simple**: 
  * Une pollution homogène venant d'entreprises dans un secteur concurrentiel (price-takers)
  * Une pollution ponctuelle
--

* `\(J\)` firmes qui émettent `\(e_j\)`, émissions totales: `\(E=\sum_{j=1}^{J} e_j\)`
--

* Une **fonction de dommage**: `\(U_i(y_i,E) = y_i - D_i(E)\)`
  * `\(y_i\)` est le revenu de l'individu `\(i\)`
  * `\(D_i(E)\)` est la fonction de dommage de l'individu `\(i\)`:  valeur monétaire de l'utilité perdue à cause du niveau de pollution `\(E\)`
      * `\(D'_i(E)&gt;0\)`, `\(D''_i(E)\geq0\)`
      * **Comment quantifier `\(D_i(E)\)`?**
      
---
## Les coûts d'abattement

* L'entreprise subit un coût lorsqu'elle choisit un niveau de de pollution en dessous du niveau qu'elle choisirait librement (ou sans régulation), noté `\(\hat{e}_j\)`
* **Coût d'abattement**: `\(C_j(e_j)\)`
  * `\(\hat{e}_j\)`: le niveau d'émission choisi par l'entreprise sans contrainte
  * `\(C_j(\hat{e}_j)=0\)`
  * `\(C_j(e_j)&gt;0\)` si `\(e_j&lt;\hat{e}_j\)`
  * `\(C'(e_j)&lt;0\)` pour `\(e_j&lt;\hat{e}_j\)`: les coûts de l'abattements sont plus faibles quand les émissions sont grandes.
      * Le coût marginal de l'abattement (*Marginal Abatement Cost*, MAC):
      $$ MAC_j(e_j)= -C'_j(e_j)&gt;0, \ \ e_j&lt;\hat{e_j}$$
  * **Le coût marginal de l'abattement  s'accroit lorsque les émissions sont réduites**, i.e. la fonction de coût d'abattement est convexe
      * **Cohérent avec les preuves empiriques**: les premières unités d'émissions réduites sont moins coûteuses  que les dernières, car celles-ci requièrent des dépenses d'investissement en capital coûteuses et des changements de procédures de production

---
## L'allocation coût-efficace

* **Arbitrage entre les impacts négatifs de la pollution sur les ménages et les bénéfices en production/consommation permis par l'externalité**
* Le niveau socialement efficace de pollution est celui qui minimise le coût social total de la pollution:
`$$\min_{e_1,\dots,e_J}SC(e_1,\dots,e_J)= \sum_{j=1}^{J}C_j(e_j) + D(E)$$`
* Vérification des conditions du premier ordre pour chaque émission individuelle `\(e_j\)` amène aux solutions `\(e_j^*\)` et `\(E^*=\sum e_j^*\)` définies par:
`$$\begin{align} 
-C'_j(e_j^*)=D'(E^*) \ \ et \ \ -C'_j(e_j^*)=-C'_k(e_k^*) \ \ \forall \ j,k \ avec \ j\neq k 
\end{align}$$`
--

.White.bg-Gold[L'allocation coût-efficace vérifie alors la double règle ci-dessus, signifiant que:]
  * **Le coût marginal de l'abattement est égal à la valeur du dommage marginal de la pollution** 
  * **Le coût marginal d'abattement est égal pour chaque entreprise**
* Un instrument est coût-efficace **s'il fixe des niveaux de pollution  spécifiques à chaque pollueur** et **si les coûts marginaux sont égaux entre eux et correspondent au dommage marginal**

---

* En haut à gauche: coût total d'abattement pour la firme 1, en dessous coût marginal d'abattement
* A partir de `\(\hat{e}_1\)`, l'abattement est coûteux lorsqu'elle réduit ses émissions. Le Coût marginal d'abattement est faible mais positif, et croît à mesure que la firme réduit ses émissions. L'aire sous la courbe du coût marginal d'abattement est le coût total (pour `\(\bar{e}_1\)` c'est l'aire `\(a+b+c\)`)

* Pour un montant d'émission `\(E^*\)`, l'efficacité est atteinte  lorsque les deux coûts d'abattement marginaux sont égaux, et qu'ils correspond au dommage marginal. Cette efficacité est atteinte pour les niveaux individuels d'émission `\(e_1^*\)` et `\(e_2^*\)`

## Reste à savoir **comment atteindre cette allocation**?

* Cela dépend de **quelle information dispose le régulateur**:
  * Si **information parfaite sur les coûts d'abattement et les dommages**
  * Alors, à l'aide d'un instrument réglementaire, il pourrait fixer des niveaux d'émissions individualisés pour chaque firme permettant de vérifier les deux conditions de coût-efficacité
--

* Mais en pratique, le .White.bg-Gold[régulateur ne dispose pas d'autant d'informations], et .White.bg-Gold[impossibilité d'imposer des normes d'émissions individualisées] (politique discriminatoire)
  * Notamment, les coûts d'abattement sont supposés comme non-connus par le régulateur: il s'agit d'une information privée, seule les firmes le connaissent. 
  * Il peut à la limite connaître les coûts moyens d'abattement, mais cette information est inutile si les coûts d'abattement sont très hétérogènes entre les firmes
  * En revanche le régulateur peut **déduire des informations relatives aux dommages.**
--

* **S'il connaît la valeur du dommage marginal (`\(D'\)`): fixer un prix aux émissions correspondant à ce dommage marginal**. C'est l'idée d'**une taxe pigouvienne**  
  * Dans le cas du changement climatique, `\(D'\)` correspond au coût social du carbone
* **S'il connaît la valeur du niveau de pollution optimale `\((E^*)\)`: définir un montant total de droits de propriété sur les émissions correspondant à `\(E^*\)`**. C'est l'idée d'un **marché de droits à polluer**      
  * Dans le cas du changement climatique, `\(E^*\)` correspond aux seuils de concentration de GES dans l'atmosphère permettant de ne pas dépasser un certain niveau de réchauffement

## 2.2. Droits de propriété et théorème de Coase (1960)
--

* En **définissant des droits de propriété sur la ressource associée à l'externalité**...
  * Par exemple: une quantité d'émissions de polluants
* ... Et si nous **évoluons dans un monde sans coûts de transaction**...
* Alors le **problème de l'externalité est résolu tout en atteignant l'allocation coût-efficace par la transaction des droits de propriété**
* Ce résultat est en plus **indépendant de l'allocation initiale des droits de propriété**
  * **Neutralité allocative**
--

* C'est le .White.bg-Gold[théorème de Coase (1960)]:

.center[
"Il est nécessaire de savoir si l'entreprise qui a causé le dommage est responsable ou non du dommage causé, car sans l'établissement de cette délimitation initiale des droits, il ne peut y avoir de transactions sur le marché pour les transférer et les recombiner. Mais le résultat final (qui maximise la valeur de la production) est indépendant de la situation [d'allocation juridique initiale] si l'on suppose que le système de prix fonctionne sans coût. "

(Coase, 1960)
]

---
## Les conséquences du théorème de Coase (I)

* **Coase (1960) publie un article intitulé "The Problem of Social Cost"**
  * Développe un ensemble d'analyse dont une discussion sur la négociation des droits de propriété associé à un dommage
  * Il l'illustre par l'exemple d'un agriculteur dont les cultures sont endommagées par le bétail d'un agriculteur voisin
  * Appelé **"Théorème"** plus tard, par Stigler (1968) 
--

* Ce théorème ouvre la voie vers la **possibilité de solutions négociées** face aux problèmes de pollution
  * Un théorème rapidement adopté par les économistes car il démontre que la négociation privée des droits de propriété peut être utilisés pour résoudre efficacement les problèmes de pollution
  * Une thèse qui était jusqu'alors peu acceptée: la gestion des ressources et des pollutions étaient vue comme un problème public
  
---
## Les conséquences du théorème de Coase (II)
* La question de **justice sociale est soulevée** par les économistes:
  * Problème éthique: "il est plus justifiable de compenser un pêcheur pour sa perte de poissons, que de demander au pêcheur de payer le pollueur pour réduire la pollution" (Kneese 1964)
* L'**applicabilité du théorème est questionnée**:
    * **Caractère diffus + grand nombre de pollueurs engendre des coûts de transaction élevés**
    * La neutralité allocative n'existerait alors que dans "un paradis sans coûts de transaction"
* Emerge lors plus tard l'idée d'un **marché de permis échangeable d'émissions**
  * Le marché réduit les coûts de transaction en centralisant les enchères, et en réduisant les coûts de transaction par rapport à une situation de "troc bilatéral" sur les droits de propriété
  * Pas de citation de l'article de Coase dans les premiers travaux &lt;a name=cite-crocker&gt;&lt;/a&gt;&lt;a name=cite-dales&gt;&lt;/a&gt;&lt;a name=cite-dalesa&gt;&lt;/a&gt;([Crocker, 1968](#bib-crocker); [Dales, 1968a](#bib-dales); [Dales, 1968b](#bib-dalesa)) 
      * il y a une différence entre la négociation bilatérale proposée par Coase et le marché 
  * De nos jours, le théorème est souvent convoqué pour justifier l'utilisation d'un marché de droits à polluer

???
Globalement, les économistes de l'environnement des années 70 questionnent la neutralité allocative. Ils ne remettent pas en doute l'idée que la négociation peut aboutir à l'allocation coût-efficace, mais que la complexité des problèmes de pollution amoindrissent son applicabilité du fait de la présence de coûts de transaction
  * les possibilités soulevées par le théorème de Coase « sont trop éloignées pour être prises au sérieux » (Mishan 1972)
  * L'idée vient alors de reproduire le marché, une situation où les coûts de transaction sont faibles

* Problème de l'équité/éthique face à une pollution dont les dommages sont intergénérationnels

### Théorème de Coase: illustration par la théorie des jeux (II)

* Le régulateur définit des **droits de propriété** d'une quantité `\(E^*&lt;\hat{e}_1\)`, qu'il alloue:
  * **Soit à la ville** qui, si elle les conserve, a le droit de n'avoir aucune pollution (`\(e_1=0\)`), ou, si elle l'échange, reçoit une compensation de la firme en lui laissant le droit d'augmenter sa pollution de `\(0\)` à `\(E^*\)`
  * **Soit à la firme**, qui, si elle les conserve, pollue `\(\hat{e}_1\)`, ou qui peut accepter une compensation de la ville en rachètant ses droits pour réduire sa pollution de `\(\hat{e}_1\)` à `\(E*\)`

---
### Théorème de Coase: illustration par la théorie des jeux (III)

* **Formallisation en un jeu à deux étapes**
  1. la firme peut proposer un contrat (`\(E,\theta\)`) avec un niveau d'émissions `\(E\)` et un paiement `\(\theta\)`
  2. La ville accepte ou non le contract. Si acceptation, la firme ne peut pas dépasser le niveau de pollution contracté
  * Négocier le contract implique des coûts de transaction `\(T\)`
  * Hypothèses: informations parfaites sur les préférences et les coûts entre agents
--

* **Résolution**: en deuxième étape, le ménage accepte le contrat ssi `\(\theta\geq D(E)\)`, et la firme n'a pas intérêt à payer plus que ce que la ville peut accepter, connaissant ses préférences, ainsi `\(\theta = D(E)\)`
--

* La firme définit alors le niveau de pollution et le paiement qui minimise ses coûts, en remplaçant le paiement par `\(D(E)\)` (le montant minimum accepté par la ville suivant le niveau de pollution):
`$$\min_{E}TC(E)=C(E)+D(E)+T$$`
Dont la solution est définie par `\(-C'(E)=D'(E)\)`: **c'est le niveau socialement optimal** `\(E^*\)`
--

* L'échange intervient ssi `\(T&lt;C(0) - [C(E^*) + D(E^*)]\)`, c-à-d **si les coûts de transaction sont inférieurs entre le coût social sans négociation et le coût social à l'optimum `\(E^*\)`**
--

* **Résultat identique si cas symétrique où les droits de pollution sont alloués à la firme et que la ville contracte avec la firme** dans le cas de cet exemple

## Deux exemples de négociation coasienne

* **Les mines de potasse d'Alsace** (1975)
  * Potasse utile à la fabrication d'engrais de synthèse
  * Sa fabrication émet du chlore dans le Rhin
  * Coût d'abattement des mines faibles: un déchet solide qui peut être entreposés loin de la rivière
  * La France, l'Allemagne, la Suisse et les Pays-Bas vont alors payer les mines à hauteur de 532 millions de francs pour réduire ses émissions
--

* **La source d'eau minérale Vittel** (1988)
  * Source polluée par les nitrates issus de l'épandage d'engrais par les agriculteurs
  * Vittel va alors contracter avec les 37 agriculteurs du bassin versant
      * Engage les agriculteurs à banir la culture de maïs, interdire les pesticides et les engrais de synthèse
      * Paiement de 230€/ha pendant 7 ans et 150 000€ de compensation directe

## Est-ce que le théorème de Coase légitime les pots-de-vin et la corruption?

* Au contraire, le théorème montre que pots-de-vin et corruption **amènent vers des allocations non coûts-efficaces **
  * La corruption amoindrit les droits de propriété car il s'agit d'une compensation contre une violation de ces droits
  * Dans un cadre de théorie des jeux, la corruption peut être vue comme une forme de menace crédible qui empêche alors d'atteindre l'allocation efficace
  * Le théorème montre ainsi les éléments qui, s'ils ne sont pas vérifiés, amèneront à une allocation non optimale
--

* **Importance du droit de l'environnement** pour protéger ces droits de propriété et montrer leur violation
--

* Ce théorème est parfois convoqué pour justifier un désengagement du secteur public dans la régulation environnemental:
  * L'idée selon laquelle créer des droits de propriété suffirait à réduire le pollution dans des situations où l'intervention publique est rendue délicate du fait du manque d'information ou de coûts administratifs élevés
  * Mais cela impliquerait alors une justice de l'environnement forte et efficace et donc des coûts de transaction élevés

## Efficacité des instruments de politique environnementale

* Le cas des .White.bg-Gold[taxes pigouviennes]
* L'entreprise polluante paye  une **taxe par unité d'émissions de polluant**:
$$TC_i(e_i)=C_i(e_i)+\tau e_i $$
* **Minimisation des coûts** définit la quantité d'émissions optimale pour la firme:
$$-C'_i(e_i^*)=\tau $$
      * **La firme réduit les émissions jusqu'au point où le coût marginal d'abattement est égal à la taxe**
      * On peut en déduire les émissions en fonction de la taxe à l'optimum de la firme: `\(e_i^*(\tau)\)`
      * Montant individuel de taxe payé: `\(e_i^*(\tau) \times \tau\)`
      * Fonction aggrégée d'émissions: `\(E(\tau)=\sum_{i=1}^{J} e_i^*(\tau)\)`
--

* **Si le régulateur connait `\(D'\)`, il fixe `\(\tau=D'\)` et la taxe est alors coût efficace**

---
## Comment varie les émissions en fonction de la taxe à l'optimum?

* Dépend de la .White.bg-Gold[forme des coûts d'abattement]
  * **Statique comparative de l'optimum privé de la firme:**
 $$ \begin{align}
 \dfrac{de_i(\tau)}{d\tau} = -\dfrac{1}{C''_i[e_i(\tau)]} 
 \end{align} $$
  * Si les coûts d'abattement sont **linéaires**, alors les émissions sont **indépendantes de la taxe**
  * Si les coûts d'abattement sont **convexes**, alors les émissions sont **décroissantes en fonction de la taxe**
--

* Si le régulateur connaît la forme des coûts moyens d'abattement, le régulateur peut alors atteindre n'importe quel niveau d'émissions en choisissant le niveau de taxe approprié
* Exemple de la taxe sur les émissions de SO2 en Suède et en France dans les années 90
  * Puis recyclage du revenu de la taxe pour subventionner l'investissement en technologie d'abattement

## Efficacité des instruments de politique environnementale

* Le cas des .White.bg-Gold[marchés de permis d'émissions échangeables]
--

* Le régulateur fixe une **quantité totale d'émissions**
* Chaque firme **obtient un permis d'émissions**
  * Elle peut en acheter d'autres ou le vendre sur le marché
  * Ses émissions finales doivent correspondre à ce que ses permis lui autorisent
---

## Les marchés de permis d'émissions

* **Quantité totale fixe de permis `\(L\)`**, déterminée par le régulateur 
* **Prix qui émerge du marché `\(\sigma\)`**
  * Faisons abstraction des problèmes d'enchère sur ces marchés et supposons qu'un prix unique d'équilibre émerge
* La firme minimise ses coûts totaux de pollution, qui incluent les coûts d'achats de permis:
`$$TC_i(e_i)=C_i(e_i)+\sigma e_i \ \, \text{CPO:}$$`
 $$ -C'_i(e_i^*)=\sigma $$
* On peut également déduire les émissions à l'optimum en fonction du prix (fonction implicite de la CPO): `\(e_i^*(\sigma)\)`
  * **C'est la demande de permis de la firme `\(i\)`**
  * Demande aggrégée de permis: `\(E(\sigma)=\sum_{i=1}^{J} e_i^*(\sigma)\)`
  * Prix d'équilibre déterminé par `\(E(\sigma)=L\)`
--
  
* **Si le régulateur connait `\(E^*\)`, il fixe alors `\(L=E^*\)` et le marché est un instrument coût efficace** (sous hypothèse que ce marché est en concurrence pure et parfaite)

## Les marchés de permis d'émissions

* Dans de nombreux cas de marché de permis d'émissions, le régulateur **a donné gratuitement les permis**, avant que les firmes se les échangent entre eux
  * Pas d'enchères
  * Don en fonction des émissions initiales
  * **Le "grandfathering"**, ou clause du grand-père
* Il s'agit alors d'une subvention offerte aux firmes existentes
  * Le marché EU-ETS dans ses phases I et II (2005-2013) a été critiqué pour avoir donné trop de permis gratuits aux firmes existantes, ce qui a conduit à un prix du carbone très bas. A partir de 2013: mise aux enchère des permis

## Taxe et marché de permis d'émissions 

* **Taxes et marché de permis d'émissions sont deux instruments coûts-efficaces similaires**
  * Ils permettent de réduire les émissions
  * En égalisant les coûts marginaux d'abattement
  * Si les permis sont mis en enchère, taxe et marché permettent tous les deux de lever un revenu pour le régulateur
* Emerge alors l'idée d'une **équivalence** entre ces deux instruments, .White.bg-Gold[équivalence qui n'est que théorique], notamment:
  * **L'effet sur la pollution d'une taxe est incertain**, **mais les coûts marginaux d'abattement sont certains car la taxe correspond à ce montant**
      * On ne connaît pas le montant de la dépollution *ex ante* en fixant une taxe
  * **L'effet sur la pollution d'un marché de permis échangeable est certain puisqu'on fixe le montant de pollution *ex ante* **, **mais l'effet sur les coûts marginaux est incertain**

* &lt;a name=cite-weitzmanb&gt;&lt;/a&gt;[Weitzman (1974)](#bib-weitzmanb): **Price vs. Quantities**
  * **Quel instrument entre taxe (prix) et marché (quantité) domine suivant l'incertitude sur les coûts d'abattement ou les dommages**?
--

* **Imaginer une situation où le régulateur se trompe sur le coût marginal aggrégé/moyen d'abattement**
* **Erreur dans le sens d'une sur-évaluation des coûts d'abattement**
  * Cas assez fréquent du fait du lobbying des industries qui mettent régulièrement en avant l'idée qu'une dépollution est coûteuse *ex ante*
  * Figure suivante: vrais coûts d'abattement (marron), et coûts d'abattement supposé avec erreur (rouge)
  * Si connaissance des coûts d'abattement sans erreur, la taxe optimale correspond à `\(\tau=p^*\)` et la quantité de permis à `\(E^*\)`.
  * L'erreur implique en revanche une sous-régulation dans le cas du marché (`\(E'\)`) et une sur-régulation dans le cas de la taxe (`\(\tau=p'\)` qui amène à `\(E''\)`)
  * **La préférence entre l'un des deux instruments dépend alors des pertes de bien-être induite par la sous- ou sur-régulation**

* **Si la courbe du dommage marginal est plus raide que la courbe du coût marginal d'abattement, les erreurs commises avec les instruments de quantité (permis négociables) sont moins coûteuses que les erreurs commises avec les instruments de prix (taxes).**
* **Si la courbe du dommage marginal est moins raide que la courbe du coût marginal d'abattement**, **les erreurs commises avec les instruments de prix (taxes) sont moins coûteuses que les erreurs commises avec les instruments de quantité (marché de permis)**

## Les conséquences des pouvoirs de marché sur la politique environnementale

* **La plupart des industries régulées par des politiques environnementales sont en monopole ou en oligopole**
  * Production d'électricité, d'essence, ou d'acier/aluminium
* **Les résultats vus précédemment vont être affectés par l'existence d'un pouvoir de marché**
* Le régulateur va chercher un **optimum de second rang** où l'**instrument de politique environnemental équilibre les deux imperfections de marché** (la pollution et le pouvoir de marché)
--

* Exemple **d'un monopole** qui, de base, ne produit pas suffisament du fait de son pouvoir de marché 
  * Une taxe de type pigouvienne viendrait alors **exacerber** la sous-production, et accroître la perte de bien-être 
  * **Le montant de la taxe de second-rang serait alors fixé à un niveau plus faible que la taxe pigouvienne** (dont le montant correspond au dommage marginal)
  * Le montant plus faible de la taxe reflète l'élasticité de la demande 
  * Plus généralement, on est ici dans une situation où le régulateur aurait intérêt (s'il peut) d'utiliser .White.bg-Gold[deux instruments pour régler ces deux distortions] 
* Même conséquence dans le cas d'un oligopole

## Conclusion sur les instruments selon le critère de coût-efficacité

* Les **instruments réglementaires ne sont en général pas coût-efficaces**, à moins que le régulateur dispose de beaucoup d'informations, ou que l'industrie est homogène

* Les **arrangements bilatéraux (accords coasiens) peuvent être coûts-efficaces**, sous certaines conditions

* **Les taxes et les marchés de permis échangeables sont coûts efficaces par design**

### Les instruments au crible des autres critères de sélection

* **Coûts administratifs**:
  * Accords coasien peuvent être très coûteux (frais juridiques), alors que les coûts administratifs sont proches entre instruments réglementaires, taxes et permis
--

* **Efficacité environnementale**:
  * Effets d'une taxe sur la pollution est incertain, alors que l'effet d'un marché de permis ou d'un standard d'émissions est certain
--

* **Flexibilité**: besoin de pouvoir ajuster les règles si de nouvelles informations / contexte change
  * Simple de réduire le montant d'une taxe ou d'un standard, plus délicat de les augmenter. Le marché de permis est l'instrument le plus flexible car le régulateur peut intervenir en achetant ou vendant des permis (idée d'une banque centrale des émissions, comme la Market Stability Reserve sur le marché EU-ETS)
--

* **Equité**:
  * La régulation des pollutions environnementales est généralement régressive, dès lors que production/consommation de biens nécessaires est visée car ces biens représentent une part budgétaire plus grande des paniers de biens des ménages aux revenus modestes comparés aux ménages aux revenus élevés.
  * Avantage à la taxe qui permet d'obtenir un revenu qui peut être redistribué pour atténuer son caractère régressif

## Une réduction des émissions sans conséquences sur la performance économique des entreprises régulées

.center[
&lt;img src="img/colmer5.jpg" height="400" /&gt;
]

---
## Un instrument efficace?

* [Colmer, Martin, Muûls et al. (2024)](#bib-colmer) montre une réduction des émissions de CO2 de l'ordre de 14 à 16%
* Sans conséquences négatives sur la performance économique
--

* Méthode très similaire chez [Dechezleprêtre, Nachtigall, and Venmans (2023)](#bib-dechezlepretrea)
  * Données de firmes pour 4 pays: Pays-Bas, France, Norvège, R-U
  * Même méthode de matching et d'estimation par la méthode de la différences-de-différences
  * ** Des résultats similaires**: .White.bg-Gold[Réduction des émissions de 6 à 17% entre 2005 et 2014]

---
## Comment expliquer l'absence de conséquences économiques?
--

* Les **fuites de carbone**
  * Les firmes régulées pourraient avoir *délocalisées* leur production dans des juridictions non régulées
  * [Colmer, Martin, Muûls et al. (2024)](#bib-colmer) montrent pas d'effets de la réglementation sur les importations des firmes: **pas de changement dans la chaîne d'approvisionnement**
  * **Pas non plus de relocalisation de la production observée**: pas d'effets sur l'emploi ou la valeur ajoutée
--

* **Des comportements d'optimisation et d'innovation**
  * [Colmer, Martin, Muûls et al. (2024)](#bib-colmer): en croisant des résultats d'enquête (non représentatif), les entreprises ont mis en oeuvre des méthodes de récupération d'énergie ou d'efficacité énergétique
--

* **Des investissements qui rendent les firmes régulées plus productives**
  * Pas de preuves empiriques mais une hypothèse possible
  
---
## Le cas des marchés carbone pilotes en Chine

* 7 marchés de permis d'émissions à l'échelle de la province, annoncés en 2011, mis en oeuvre en 2013
  * Des prix relativement bas entre 2013 et 2015 (5 à 7$/tCO2)
  * **Passage à un marché national en 2021**
  * **40% des émissions chinoises sont couvertes, 15% des émissions mondiales**
--

* [Cui, Wang, Zhang et al. (2021)](#bib-cuid): .White.bg-Gold[évaluation de la réduction des émissions permises par les marchés pilotes]
  * **Par la méthode de la différences-de-différences** en comparant les firmes régulées et les firmes non-régulées en les appariant par une méthode de matching
  * **Réduction des émissions de l'ordre de 16% de 2013 à 2015**
  * Adoption de méthodes de conservation énergétique et de changement de sources énergétiques
  * Des **conséquences négatives sur le capital et l'emploi**, mais **accroissement de la productivité**

---
## Le cas du secteur de l'énergie au R-U

* Du fait des prix du marché EU-ETS bas, le R-U a **ajouté une taxe carbone sur les industries régulés par le marché carbone** en 2013
  * Loi de 2008 sur le changement climatique contraignait le R-U à réduire ses émissions
  * **Une taxe de 6€/tCO2 à 26€ en 2017**
  * **Transformation énergétique sur la même période**: notamment, décroissance importante de l'utilisation du charbon 
--

* [Leroutier (2022)](#bib-leroutier) étudie l'effet de cet instrument 
  * Comparaison entre les firmes régulées par cette taxe avec une méthode de différences-de-différences en créant un groupe de contrôle "synthétique" de firmes ayant des caractéristiques similaires et couvert par le marché EU-ETS en Europe (méthode d'appariement)
  * Des **réductions supplémentaires à celles des firmes régulées par le marché EU-ETS de l'ordre de 20 à 26% sur la période 2013-2017**
  * Réduction permises par:
      * **Une amélioration de l'efficacité énergétique**
      * **Des fermetures d'usines les plus polluantes**
      

---
## Ces marchés de permis d'émissions sont-ils la panacée?

* L'ensemble de ces résultats vont dans le sens d'un instrument **efficace** pour effectivement réduire les émissions à moindre coût
  * Notamment car les **premières tonnes de GES abattues sont les moins coûteuses** 
  * .White.bg-Gold[Qu'en sera-t-il pour les suivantes?] Car les coûts marginaux d'abattement sont croissants
--

* Des **marchés qui doivent être plus régulés**
  * **Création d'une réserve de stabilité de marché** en 2019 pour réguler les quantités sur le marché
      * Problème: sur-allocation des permis initiaux données gratuitement (*grandfathering*) 
      * Rachat des permis sur le marché par la réserve, puis revente ultérieure 
  * **Participation d'acteurs financiers sur le marché carbone européen**
      * Si leur participation améliorer la liquidité du marché, ils introduisent des comportements spéculatifs 
      * Des objectifs encore plus ambitieux sur les quotas échangés vont d'autant plus accroître l'incitation aux acteurs spéculatifs à participer
      * **Besoin alors d'une entité régulatrice des transactions et de plus de transparence sur les acteurs participants au marché**
* **Des marchés qui doivent être accompagnés pour atteindre la *neutralité carbone* **
  * L'offre de permis sera nulle à horizon 2040
  * Organisation et régulation des marchés dans cette perspective
  
---
## 3.2. L'évaluation de la taxe carbone

* Nous avons vu dans la section 2. le **cadre théorique** qui montre l'aspect coût-efficace de la taxe
--

* Deux analyses empiriques ici:
  * Comment les économistes proposent d'évaluer les conséquences et le design d'une taxe carbone dans un secteur non régulé: **le cas du secteur agricole**
  * Comment les économistes étudient l'**acceptabilité de la taxe carbone**
  
---
## Taxer les émissions de GES du secteur agricole

* Un secteur **non-régulé**
  * Entre 15 à 20% des émissions de GES mondiale viennent du secteur agricole
  * Les émissions **directes** sont dues au méthane (CH4, digestion du bétail) et au protoxyde d'azote (N2O, épandage d'engrais)
* Son **exclusion de la régulation des émissions entraînent une augmentation des coûts d'abatement**
  * On se prive de réduction des émissions à faible coût notamment à travers le stockage de carbone dans les sols
* **Problèmes associés à la régulation de ces émissions de GES**:
  * Des **coûts d'abattement très hétérogènes**
  * Un **grand nombre de pollueurs dont il faut contrôler et vérifier la pollution**
  * Importance de l'**acceptabilité** d'un instrument de régulation dans ce secteur

## Une taxe carbone avec une couverture partielle (I)

[De Cara, Henry, and Jayet (2018)](#bib-decara): "Optimal coverage of an emissions tax in the presence of monitoring, reporting and verifying costs (MRV costs)".

* **Couverture partielle des émissions en excluant des agents est coûteuse socialement**
  * Instrument n'est plus coût efficace car les coûts marginaux ne sont pas égaux entre eux
* Mais en présence de coûts administratifs (MRV costs) élevés, **gains à ne pas contrôler les fermes ayant les coûts d'abatement élevés**
  * Concentrer l'effort de régulation sur les fermes les plus efficaces pour réduire les émissions tout en ayant des coûts administratifs raisonnables
--

* L'enjeu est alors de **définir la couverture optimale du secteur**:
  * .White.bg-Gold[Le pourcentage socialement optimal de fermes taxées]
  * Sachant que le **régulateur n'est pas capable d'identifier les fermes les plus efficaces** pour réduire les émissions
  * Il ne peut que sélectionner à partir d'une caractéristique observable à faible coût (`\(\theta\)`) comme la taille de la ferme par exemple

## Une taxe carbone avec une couverture partielle (III)

.pull-left[
* **Les 80% des fermes les moins émettrices émettent environ 1/4 des émissions**
* **Les 20% des fermes les plus émettrices se trouvent souvent être celles ayant les coûts d'abattement les plus faibles**
* Le régulateur ne ferait pas trop d'erreurs en fixant un seuil `\(\theta_s\)` **sur les émissions initiales** au-dessus duquel les fermes sont taxées et régulées, et en-dessous duquel elles sont exemptées
  * Critère d'exemption similaire au marché carbone européen

## Une taxe carbone avec une couverture partielle (IV)

.pull-right[
* A mesure que le seuil d'exemption diminue (`\(F(\theta_s)\)` se déplace vers la gauche), plus le nombre de fermes régulées augmente et plus le bénéfice social de la régulation diminue, jusqu'à devenir négatif dans une situation de couverture totale
  * A mesure que le nombre de fermes régulées augmentent, les coûts de contrôle augmentent, mais le bénéfice associé à l'abattement s'accroit faiblement car les nouvelles fermes régulées ont un potential d'abattement de + en + faible pour un coût d'abattement de + en + élevé.
  * Lorsque `\(F(\theta_s)=0\)`, il est socialement préférable de ne rien faire, plutôt que de réguler toutes les fermes
]

## Une taxe carbone avec une couverture partielle (V)

* L'article montre qu'en réalité .White.bg-Gold[il existe un ensemble de solutions intermédiaires préférable socialement]: **la couverture partielle**, où seules les fermes au-dessus `\(\theta_s\)` sont taxées et contrôlées.
  * **Couverture partielle optimale** (point bleu), celui mis en oeuvre par le régulateur si connaissance parfaite des coûts d'abattement, et **couverture avec seuils approximés** (points rouges), si connaissance partielle de la forme des coûts d'abattement
  * En pratique, le régulateur ne peut pas choisir le seuil optimal car **il n'a qu'une connaissance imparfaite de la forme des coûts d'abattement en fonction de `\(\theta\)`**. Il choisit donc un seuil approximé.

]

* Le gain à adopter une couverture partielle dépend du niveau taxe carbone
* Plus la taxe est grande, plus le gain à adopter une couverture partielle est important, car plus le bénéfice net de l'abattement est grand (en supposant que la valeur de la taxe correspond au coût social du carbone)
* **Pour un coût social du carbone de 100€/tCO2, entre 50% et 60% des fermes devraient être régulées** selon la règle de fixation du seuil
]

## Régressivité de la taxe carbone dans le secteur agricole 

* **La taxe carbone appliquée au secteur agricole est régressive**, i.e., les effets sont proportionnellement plus grands sur les agriculteurs à revenu faible qu'à revenu élevé
  * Agriculteurs à revenus élevés ont à disposition des options techniques d'atténuation des émissions plus étendues et moins coûteuses
--

.pull-left[
[Ollier and De Cara (2024)](#bib-ollier): **Redistribuer le revenu de la taxe permet de réduire les inégalités de revenu entre agriculteurs**:
  * Sans redistribution, les inégalités sont les plus élevées (courbe de Gini noire)
  * Redistribution croissante avec l'effort d'abattement (système au mérite des émissions réduites)  les inégalités sont réduites (Gini rouge, BN-CRAT)
  * Avec redistribution décroissante avec les émissions finales (système de redistribution au mérite des petits pollueurs), les inégalités sont encore plus réduites (Gini bleu)
]
.pull-right[
.center[

]
]

## La régressivité de la taxe carbone

* Plus généralement, et pour étendre l'analyse au delà du secteur agricole, **la taxe carbone est régressive**
  * Comme les ménages pauvres consacrent souvent une part plus importante de leur budget à des bien à forte intensité carbone que les ménages riches, les émissions en fonction du revenu avant la mise en oeuvre de la taxe augmentent moins que linéairement
  * Voir par exemple &lt;a name=cite-douenne&gt;&lt;/a&gt;[Douenne (2020)](#bib-douenne) pour un exercice de simulation des conséquences d'une taxe carbone avec redistribution sur les ménages
--

* .White.bg-Gold[Régressivité affecte l'acceptabilité de la taxe] 
  * **Les ménages soutiennent des politiques fiscales progressives**
  * **Biais cognitifs**: les individus ont tendance à surestimer les conséquences négatives de la taxe carbone même en leur redistribuant le revenu de la taxe
     * .White.bg-Gold[Cas particulier du mouvement des Gilets Jaunes]: &lt;a name=cite-douennea&gt;&lt;/a&gt;[Douenne and Fabre (2022)](#bib-douennea) montrent à partir d'une enquête queles croyances sur la régressivité de la taxe carbone se sont accrues à la suite du mouvement des Gilets Jaunes

* Un article qui montre **l'importance de l'information sur le changement climatique et la politique climatique pour améliorer l'acceptabilité des instruments de politique environnementale**
