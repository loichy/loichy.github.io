## L'économie de marché

* .White.bg-Gold[Définir l'économie de marché]:
  * **Echange libre/volontaire entre producteurs/consommateurs de ressources et de biens**
  * **Coordination des dynamiques individuelles par les prix** 
  * Rôle central de la **liberté d'entreprise** et des **droits de propriété**
      * Droit de posséder un bien et de percevoir les revenus qui y sont associés
  * Rôle central du consommateur qui valide ou non par leur demande les offres marchandes des entrepreneurs
  * .White.bg-Gold[Intrinséquement lié au capitalisme], qui sont **deux formes d'économie décentralisée**, où la dernière serait le système de propriété privé des moyens de production
* **LES** économie**S** de marché
  * Gradient d'intervention de l'état sur ce marché
  * Dépendent des contextes et des institutions qui soutiennent/accompagnent les marchés
      * Economie "sociale" de marché en Europe à l'après-guerre
      * Economie "durable" de marché illustrée avec la *Corporate Sustainability Reporting Directive* (CSRD, 2025)
      
???
Concept de capitalisme est relativement délaissé par les économistes mainstream. Mais cela n'est pas la même chose que d'étudier l'économie à travers le prisme du capitalisme que celui de l'économie de marché
* **capitalisme**:
  * Observer la manière avec laquelles les individus accumulent le capital?  A l'aide de quelles forces sociales ils l'accumulent? 
  * Signifie ensuite analyser et observer les rapports structurellement inégaux entre acteurs économiques (entre ceux qui possèdent le capital, et ceux qui sont subordonnés au capital)
* L'économie de marché définit un grand nombre de choses: marchés de petits poducteurs aux marchés financiers
* **L'économie de marché**: 
  * part d'une situation idéalisée ou les individus échangeraient librement dans un cadrement mutuellement profitable (orifut pour les prod, utilité pour les consommateurs)
* Quelle analyse fait le plus sens? 
  * Dans le cas de l'analyse des crises écologiques, les deux analyses font sens. 
  * Dans le cas de l'économie de marché, les crises écologiques sont de simples dysfonctionnement. Leur  résolution aux crises écologiques sont pensées à partir des mécanismes de marché: amélioration de l'information, taxe pour réduire les externalités, création de nouveaux marché 
  * Dans la perspective capitaliste: ce qui est considéré ccomme immuable dans l'économie de marché n'est plus naturelle et peut pêtre contesté   
      * Cas des normes/croyances qui consolident les rapports de domination ou de pouvoir au sein des entreprises. On réflécht alors à la gestion de biens communs ou à des modes de possession alternatif (coopérative)
* Le capitalisme est en fait une économie de mrché avec des inefficiences, ou des organisations trouvent leur raison d'être dans les imperfections du marché (vision d'Arrow).

## L'économie planifiée

* .White.bg-Gold[Définir l'économie planifiée]:
  * Une **économie centralisée**, **où une autorité politique impose un programme plus ou moins détaillé des missions qu'ont à réaliser producteurs/consommateurs**
     * Type Gosplan pour l'ancienne Union Soviétique
     * L'ordre spontané du marché n'est pas l'ordre volontaire de l'état central (Hayek)
  * **Socialisation des risques et des profits**: 
      * Les agents se bornent à exécuter les consignes qui leur sont données: ils ne sont donc pas responsables des échecs éventuels de la planification
* **Planification impérative** vs. **planification indicative**
  * Dans le premier cas: type Gosplan
  * Dans le second cas: l'exemple de la planification française et du commissariat général au Plan 
      * Fixation d'objectifs à atteindre, des moyens nécessaires, et du cadrage des étapes de réalisation et des méthodes de suivi, pour réduire les incertitudes sur le futur des acteurs
      * S'apparente à un exercice de communication politique sur la période récente

3e voie: l'économie traditionnelle: assignation sociale des rôles économiques donnés aux agentds

Le commissariat général au plan en France a vocation a cooordonner des travaux de planaifications et de réflexions prospective pour éckaurer les choix publics au regard des enjeux démo, socio et éco à LT

## La transition vue par le prisme de l'économie de marché

* Nous avons vu jusqu'ici l'**analyse économique de la transition au sein d'une économie de marché**
  * Les crises écologiques sont des **défaillances de marché **
  * Il faut **retrouver une situation d'échanges idéale**
  * Pour retrouver une situation d'échanges équilibrée, il faut alors **penser à des mécanismes de marché pour résoudre ces crises**:
      * **Améliorer l'information**
      * **Création de nouveaux marché**
      * **Taxes/subventions** pour modifier les prix relatifs et inciter les changement de comportement 

---
## Pourquoi l'analyse par l'économie de marché de la transition domine?

* **Thèse libérale**:
  * La coordination marchande: Le marché est un ordre auto-régulé grâce à la flexibilité des prix. Main invisible qui relie les intentions individuelles égoïstes et les résultats sociaux bénéfiques.
* **Thèse analytique** issue de la microéconomie walrassienne:
  * Les rationalités individuelles peuvent composer un équilibre optimal en concurrence parfaite
* **Thèse pragmatique**:
  * Le marché règne partout: il s'agit donc de délimiter la juste place de l'état pour réguler ces marchés
--

* **Pourquoi donc ouvrir la question des systèmes économiques pour aborder la transition?**
  * Les crises écologiques et sociales sont **propres à nos systèmes économiques** (comme nos succès économiques)
  * .White.bg-Gold[Revenir à la racine de nos systèmes]

## La critique de la planification selon Hayek

*La route de la servitude* (1946) et les ouvrage suivants d'Hayek présente sa critique économique et politique de l'économie planifiée 
* La **planification est autoritaire**
  * L'état central impose un code de valeur par la planification
  * Seule la combinaison d'un système de marché libre et une démocratie permet la liberté individuelle
--

* **L'importance des prix et de la monnaie pour allouer les facteurs de production**
  * Dans une situation de socialisme, il n'y a plus d'échanges marchands
  * La monnaie ne peut plus déterminer la valeur des échanges
  * L'état socialiste ne dispose pas d'unité pour connaître la rareté relative et choisir quels combinaisons de facteurs de production sont faisables
--

* **La charge informationnelle incommensurable de l'état centralisateur**
  * Impossibilité de caractériser de manière formelle la solution optimale de manière centralisée
  * Une méthode qui n'est pas flexible

## La critique de l'économie de marché par Polanyi

- **Thèse principale de Polanyi** : la grande transformation (1944)
  - L'économie de marché repose sur la **fiction de la marchandisation** des facteurs de production (travail, terre, monnaie)
      - Leur marchandisation est fictive et repose sur des normes/conventions
- **Concepts clés :**
  - **Double mouvement** : les sociétés réagissent instinctivement aux dérives du marché par des régulations et des protections sur ces marchandisent fictives (lois sociales, protectionnisme...)
  - **Désencastrement** : l'économie de marché se détache des structures sociales, créant des crises économiques et environnementales
     * Les marchés s'organisent autour des marchandises fictives, et la crise est le signe de l'oubli de leur nature fictive par le système de l'économie de marché comme dans les années 30
- **Application à la transition écologique :**
  - Les biens environnementaux sont des marchandises fictives, et utiliser le marché comme une solution d'autorégulation n'est pas approprié
  - La transition nécessite des **formes alternatives de gouvernance** (ex. biens communs, régulations collectives)

???
- La terre n'et pas une marchandse car on ne peut que la modifier partiellement
- Le travail est un construit qui relève d'un processus de socialisation extra-économique
- La monnaie est une convention sociale de mesure commune des richesses et permet la prévalidation des échanges marchad
- Pour que le capitalisme fonctionne, ces trois éléments doivent être considérés comme des marchandises: pour que le capitalisme tienne il faut alors organiser les pseudos marchés et protélger la société du marché. Maius cette protection entrave le fonctionne économique du capitalisme et limite la valorisation du capital, suscitant alors des crises économiques.
- L'idée de polanyi est que les individus, d'eux-même, réfute l'économie de marché et réglementant le fonctionnant des marchés des pseudo-marchandises
- De fait l'économie de marché
-- Travail, terre et monnaie sont des éléments esseentiels, pour le capitalisme ils doivent être organisés en marché. Mais il est évident qu'ils ne sont pas des marchandises: cela serait invivable si le travail était parfaitement échanger ainsi que la terre sur un marché libre. L'éconmie de marché est alors construite sur des fictions grossières, et aucune sociétgé ne pourrait suppoerter les effets d'un pareil système
- L'objectif de polanyi est de critiquer le fascisme; "la ,écessité de retrouver l'unité sociale, et fantasmée d'un peuple, dissoute par l'extension du capitalisme libérale et son inssuffisante intégration sociale. Permet de comprendre pourquoi le libéralisme peut déboucer au totalitarisme fasciste
* Le fascimse rejette le marché libre, et refuse également le socialisme démocratique. Il propose une restructuration autoritaire de l'économie ou l'état controle certains aspects économiques dans une logique nationaliste et anti égalitaire. Il vise à réencastrer l'économie en sacrifiant les libertés iondividuelles et l'altérité.

## La gestion des communs selon Ostrom (I)

**Que signifie "Communs" en économie ? **
--

- Le terme **Communs** désigne une forme de **gouvernance** :
  - La gouvernance régule **qui** est autorisé à s'approprier la ressource, **comment** l'approprier (moment, quantité, technologie), les règles de **surveillance** et d'application, la **résolution des conflits**, etc.
      - **Ressources** gérées **collectivement** pour être accessibles à tous les membres d'une communauté
      - Pertinent lorsque l'autorité centrale n'est pas impliquée dans la gouvernance de la ressource
      - La communauté d'utilisateurs et des tiers interviennent dans la gouvernance
  - Peut s'appliquer à des ressources rivales comme non-rivales
      - Ressources intellectuelles sous licence **Creative Commons** : logiciels en accès libre, Wikipedia

---
## La gestion des communs selon Ostrom (II)

**Les formes de gouvernance collective**

- **Les acteurs** participent au fil du temps à **l'élaboration** et à **l'adaptation** des **règles** dans des arènes de choix collectif (*pas nécessairement toutes les règles*)
- **Le type de gouvernance collective modifie la nature de la ressource**

  1. **Ressources en accès libre** : gouvernance limitée
     - Exemples : Pêcheries en eaux internationales
  2. **Ressources communes ou en propriété collective** : auto-gouvernance restreignant leur propre usage. Exemples :
       - Pêcheries dans les eaux côtières d'un pays
       - Administration de l'eau d'un bassin versant 
       - Pâturages de montagne

---
## La gestion des communs selon Ostrom (III)

**L'économie de la gouvernance des Communs**

- Les ressources communes sont menacées d'**épuisement**
  - **Problème du passager clandestin**
- Comment limiter l'usage de ces ressources pour assurer leur viabilité à long terme ?
--

  - **Théorie économique conventionnelle** propose :
      1. Allocation de **droits de propriété privée**
      2. Gestion par un **État centralisé**


**Elinor Ostrom (1990), "Governing the Commons"**
&gt; " des communautés d'individus ont utilisé des institutions ne relevant ni de l'État ni du marché pour gouverner certaines ressources avec un succès raisonnable sur de longues périodes."


- **La théorie conventionnelle n'est pas généralisable :** des formes hétérogènes d'auto-gouvernance peuvent **gérer durablement** les ressources communes

---
## La gestion des communs selon Ostrom (IV)

**Principaux enseignements de la théorie des Communs**

- Exemples de communs dans l'agriculture :
  - Systèmes d'irrigation (Ostrom, 1995)
  - Pâturages de montagne
  - Écosystèmes à portée géographique réduite (ex. biodiversité, voir le rapport Dasgupta, 2019)
- Moins de juridictions impliquées dans les négociations, surveillance réduite : application mutuelle de la coopération
- D'après la littérature empirique, difficile de mesurer le succès des communautés dans la gestion de leurs ressources
  - Certains **facteurs clés de succès** ont été identifiés, liés aux caractéristiques des ressources et des communautés

## La critique post-marxiste du capitalisme

***Le capitalocène***: concept développé par Jason Moore et d'autres pour désigner l'ère géologique actuelle, marquée par l'impact des activités humaines sur la planète, en particulier à travers le capitalisme.

* "*A History of the World in Seven Cheap Things: A Guide to Capitalism, Nature, and the Future of the Planet*" (2017), Jason Moore et Raj Patel
  * "*Capitalism thrives not by destroying natures but by putting natures to work—as
cheaply as possible.*"
--

* "Le *cheapening* est une stratégie [...] qui mobilise tous les types de travail (humain et animal, botanique et géologique) avec le moins de compensation possible
* Le capitalisme se développe continuellement en réduisant le coût des ressources essentielles (travail, nourriture, énergie, etc.) par l'exploitation de la nature et des ressources non marchandes
    * Stratégie du capitalisme consistant à réduire les coûts des éléments essentiels à la vie et à transformer les relations naturelles et humaines en relations marchandes à faible coût pour maintenir les taux de profit
* Le capitalisme n'est pas seulement un système économique, **c'est aussi une façon d'organiser les relations entre l'homme et le reste de la nature**: c'est le capitalocène.

Ouvrage illustgre son propos à partir d'une approche matérialiste de l'histoire:
  * Montrer que les évènements historiques sont conditionnés par l'influence de l'évolution des moyens de production
  * Importance des conditions données et héritées du passé lorsque les hommes font l'histoire
  * L'exemple de la conquête des amériques par les espagnols et les portugais

## 2. Des expériences historiques de la planification 

**Le cas de l'ancienne Union Soviétique**
- **Contexte historique :**
  - Mise en place de la planification centralisée après la Révolution d'Octobre 1917
  - Création du **Gosplan** en 1921 pour organiser l'économie
  - Plans quinquennaux (1928-1991) visant l'industrialisation rapide

- **Problèmes structurels de la planification :**
  - Bureaucratie lourde et inefficace
  - Manque de flexibilité et d’innovation
  - Mauvaise allocation des ressources (surproduction, pénuries chroniques)
  - Système d’incitations inadapté (production quantitative au détriment de la qualité) 

---
## Catastrophes environnementales sous l'économie planifiée soviétique

- **Surexploitation des ressources naturelles :**
  - Intensification de l'agriculture : déforestation massive, appauvrissement des sols
  - Industrialisation lourde : pollution de l'air et des rivières

- **Exemples marquants :**
  - **Assèchement de la mer d'Aral** : détournement des fleuves pour l'irrigation du coton
  - **Catastrophe de Tchernobyl (1986)** : faibles contrôles de sécurité et réponse tardive
  - **Pollution industrielle** : émissions toxiques dans les bassins miniers et métallurgiques

- **Conséquences sociales et écologiques :**
  - Dégradation de la santé publique (maladies respiratoires, cancers)
  - Perte de biodiversité et destruction d’écosystèmes
  - Incapacité du système à répondre efficacement aux crises environnementales

## La planification dans les économies décentralisées: le cas de la France

* **L'intensification de la production pour moderniser les économies dans l'entre-deux guerres et après WW2**
  * **Jean Monnet**, premier commissaire général au Plan (1946), qui réunit une communauté de planificateurs (Alfred Sauvy, Jean Fourastié)
  * **Concentration sur six secteurs pour augmenter leur productivité** (charbon, électricité, ciment, agriculture, transport et acier)
  * **Flèche les crédits du plan Marshall**
  * **Son caractère prescriptif s'amenuise au cours du temps**, puis devient purement indicatif à partir des années 70
--

* **Retour du plan en 2020**:
  * Nomination d'un **haut-commissaire au plan** pour coordonner les travaux de planification au sein de France Stratégie
  * Quelle capacité à influer sur la trajectoire de l'économie française?
      * Des notes et des rapports de haut niveau, mais peu d'articulation avec les ministères
      * Un **plan symbolique**

---
## La planification dans les économies décentralisées: le cas des Etats-Unis

* Rôle clef de l'état fédéral dans la **planification scientifique et l'innovation**
  * Pallier le court-termisme du secteur privé
* Rôle des agences gouvernementales
  - **DARPA** (*Defense Advanced Research Projects*): Créée en 1958 après le lancement de Sputnik
  - Favorise le *blue-sky thinking* : innovations à long terme.
  - Financement de technologies devenues essentielles : Microprocesseurs, ARPAnet (prémices d'Internet)
* **Accélère les innovations du secteur privé**: une complémentarité
  - L'État ne "choisit pas les vainqueurs" mais établit des bases solides, sur lesquelles le secteur prend le relai 
  - Exemple : Apple a bénéficié de technologies financées par l'État.

## 3. L'économie de marché face à la transition écologique

* La "planification" actuelle en France est plutôt un **exercice de communication politique** 
  * Des **documents programmatiques**: Stratégie Nationale Bas-Carbone (SNBC), plan
d’adaptation au changement climatique (PNACC) et la programmation pluriannuelle de
l’énergie (PPE)
  * **Engagements de ces plans non-respectés, ni suivis**
  * Certains rapports de suivi  dévaforables ne sont pas communiqués
      * "Quel est l'état de l'environnement en France", 2024 des services statistiques du ministère de l'environnement 
* **Cloisonnement entre ces stratégies**
  * Besoin de construire des synergies entre acteurs de la politique publique
* Ces **outils ne permettent pas de planifier en tant que tel**
  * Pas de projection opérationnelle

---
## Que planifier?

* Issu d'une d'un rapport de [**France Stratégie (lien)**](https://www.strategie.gouv.fr/publications/soutenabilites-orchestrer-planifier-laction-publique) et d'une [**note de la fondation Jaurès (lien)**](https://www.jean-jaures.org/publication/balance-ton-plan-relance-economique-planification-et-democratie/) 
--

- Ne pas planifier la consommation individuelle, mais les **investissements publics stratégiques**
- **Viser des secteurs clés **: transports, éducation, transition énergétique
  * .White.bg-Gold[Une politique de l'offre] pour reconstruire un tissu industriel vert en France
  * Des **programmes d'investissements prioritaires massifs** financés par une agence dédiée à l'innovation
- Défi de la **coordination des plans existants et de leur cohérence globale**
- Vers une **nouvelle politique industrielle** pour une transformation technologique et écologique
  * Echo avec le [**Rapport Draghi**](https://commission.europa.eu/topics/eu-competitiveness/draghi-report_en) pointant le défi du rattrapage et de la réindustrialisation des économies européennes

---
## Comment planifier?

* La question de la **méthode**: mes suggestions ci-dessous, mais qui mériteraient d'être étayer par des lectures en sciences politiques 
--

- Impliquer citoyens, collectivités, entreprises et associations dans la définition des objectifs
  * **Rendre le plan plus légitime**
  * Exemple de la Suède : 16 objectifs environnementaux à long terme définis démocratiquement
- **Adapter la constitution**
  * Un plan de législature qui établirait les domaines à soutenir en priorité par des investissements directs
  * Plan nourri par le dialogue parlementaire et social
- **Adapter la gouvernance** : regrouper les structures de prospective et d'investissement
  * Des dispositifs de financement éparpillés: Banque publique d’investissement, Secrétariat général à l’investissement, Agence nationale de la cohésion des territoires
- Nécessité d'une **planification territorialisée** adaptée aux réalités locales
  * Les collectivités territoriales ne sont à l'heure actuelle pas impliqué dans la conception des plans économiques gouvernementaux
