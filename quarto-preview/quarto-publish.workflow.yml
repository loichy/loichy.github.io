# À copier vers .github/workflows/quarto-publish.yml (je ne peux pas écrire
# directement dans .github/workflows/ depuis cette session).
#
# Rend le site avec Quarto à chaque push sur main et republie le dossier
# docs/, exactement comme tu le fais aujourd'hui à la main. Aucun changement
# des réglages GitHub Pages nécessaire (toujours "Deploy from branch: main /docs").
#
# Prérequis : dans les Settings > Actions > General du dépôt GitHub, autoriser
# "Read and write permissions" pour le GITHUB_TOKEN (nécessaire pour que
# l'action puisse pousser le commit de rendu).

name: Render and Deploy Quarto Site

on:
  push:
    branches: [main]
    paths:
      - '**.qmd'
      - '_quarto.yml'
      - 'styles.css'
      - '*.png'
      - '*.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          if git diff --cached --quiet; then
            echo "Aucun changement de rendu à publier"
          else
            git commit -m "Rendu automatique du site via Quarto [skip ci]"
            git push origin main
          fi
